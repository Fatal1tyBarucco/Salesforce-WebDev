# 🚀 Salesforce Release Notes Pipeline
#
# Flowchart:
#   Salesforce Help → Playwright → FeatureImpactParser → Markdown → README → GitHub Pages
#
# Jobs:
#   1. Extract & Generate (scrape, parse, generate, commit)
#   2. Create Issue on Failure (diagnóstico didático com plano de ação)
#
# Note: Lint, typecheck and tests are handled by the Python Quality workflow
# (python-quality.yml) which runs on every push and PR.
#
# Schedule: Weekly on Monday at 08:00 UTC
# Manual: workflow_dispatch with optional release_slug and dry_run

name: 🚀 Salesforce Release Notes Pipeline

permissions:
  contents: write
  issues: write
  pages: write

on:
  schedule:
    - cron: "0 8 * * 1"

  workflow_dispatch:
    inputs:
      release_slug:
        description: "Slug da release específica (ex: summer_26). Deixe vazio para todas."
        required: false
        default: ""
      dry_run:
        description: "Simular sem escrever arquivos?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: pipeline-${{ github.event_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  WORKING_DIR: "."
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  extract:
    name: 📥 Extração e Geração de Artefatos
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Instalar Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Instalar GitHub CLI
        run: sudo apt-get install -y gh

      - name: Configurar identidade do bot para commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolver parâmetros de execução
        id: params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "dry_run=${{ github.event.inputs.dry_run }}"           >> $GITHUB_OUTPUT
            echo "release_slug=${{ github.event.inputs.release_slug }}" >> $GITHUB_OUTPUT
          else
            echo "dry_run=false"   >> $GITHUB_OUTPUT
            echo "release_slug="   >> $GITHUB_OUTPUT
          fi

      - name: Executar pipeline de extração
        run: |
          set -o pipefail
          mkdir -p /tmp/pipeline_logs
          ARGS=""
          if [ "${{ steps.params.outputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ steps.params.outputs.release_slug }}" ]; then
            ARGS="$ARGS --release ${{ steps.params.outputs.release_slug }}"
          fi
          uv run python -m src.main $ARGS 2>&1 | tee /tmp/pipeline_logs/extraction.log
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Validar caches de resumo contra meta.json
        if: steps.params.outputs.dry_run == 'false'
        run: |
          {
          echo "🔍 Validating summary caches against .meta.json..."
          ERRORS=0
          for meta_file in releases/*/.meta.json; do
            [ -f "$meta_file" ] || continue
            dir=$(dirname "$meta_file")
            slug=$(basename "$dir")
            cache_file="$dir/.summary_cache.json"

            if [ ! -f "$cache_file" ]; then
              echo "⚠️  $slug: no .summary_cache.json found"
              continue
            fi

            # Extract meta total_features
            meta_total=$(python3 -c "import json; print(json.load(open('$meta_file')).get('total_features', 0))")
            cache_exec=$(python3 -c "import json; print(json.load(open('$cache_file')).get('executive_summary', ''))")
            cache_cat_count=$(python3 -c "import json; print(len(json.load(open('$cache_file')).get('category_summaries', {})))")

            echo "📋 $slug: meta=$meta_total features, cache_cats=$cache_cat_count"

            # Check: cache says 0 features but meta has data
            if [ "$meta_total" -gt 0 ] && echo "$cache_exec" | grep -q '0 novos recursos'; then
              echo "❌ $slug: cache says '0 recursos' but meta has $meta_total"
              ERRORS=$((ERRORS + 1))
            fi

            # Check: no category summaries for release with categories
            meta_cat_count=$(python3 -c "import json; print(len(json.load(open('$meta_file')).get('categories', [])))")
            if [ "$meta_cat_count" -gt 0 ] && [ "$cache_cat_count" -eq 0 ]; then
              echo "❌ $slug: 0 category_summaries but meta has $meta_cat_count categories"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Found $ERRORS invalid cache(s). Pipeline will still commit other changes."
          else
            echo "✅ All summary caches are valid"
          fi
          } 2>&1 | tee /tmp/pipeline_logs/cache_validation.log

      - name: Verificar alterações geradas
        id: git_status
        if: steps.params.outputs.dry_run == 'false'
        run: |
          if [ -n "$(git status --porcelain releases/ README.md README.en.md)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validar artefatos gerados
        if: |
          steps.params.outputs.dry_run == 'false' &&
          steps.git_status.outputs.has_changes == 'true'
        run: |
          set -o pipefail
          uv run pytest tests/ -q --tb=short 2>&1 | tee /tmp/pipeline_logs/artifact_tests.log

      - name: Commit e push dos artefatos gerados
        if: |
          steps.params.outputs.dry_run == 'false' &&
          steps.git_status.outputs.has_changes == 'true'
        run: |
          set -o pipefail
          {
          # Stash locais (releases/ + READMEs) antes do pull para evitar
          # conflito quando o remote estiver à frente do checkout inicial.
          git stash push -m "pipeline-changes-pre-pull" -- releases/ README.md README.en.md
          # Tolerar remotos inalcançáveis e não-fatal: continuar se não houver
          # nada novo a integrar (fast-forward já implícito no push).
          git pull --ff-only origin ${{ github.ref_name }} || echo "::warning::git pull falhou (continuando com mudanças locais)"
          git stash pop || true
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Add all changes — not just hardcoded paths — and detect empty commits.
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit (already up-to-date with remote)."
          else
            git commit -m "chore(release-notes): atualização automática — ${TIMESTAMP}" || exit 1
            git push --force-with-lease origin HEAD:${{ github.ref_name }}
          fi
          } 2>&1 | tee /tmp/pipeline_logs/commit_push.log

      - name: Criar GitHub Release
        if: |
          steps.params.outputs.dry_run == 'false' &&
          steps.git_status.outputs.has_changes == 'true'
        env:
          # Prefer a PAT (RELEASE_TOKEN) over the default GITHUB_TOKEN so that
          # release creation has the necessary scope to create refs/tags.
          # The GITHUB_TOKEN intentionally cannot create refs in some org setups,
          # which surfaces as HTTP 422 "Cannot create ref due to creations
          # being restricted" — see issue #112.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_SLUG: ${{ steps.params.outputs.release_slug }}
        run: |
          set -o pipefail
          python3 << 'PYEOF' 2>&1 | tee /tmp/pipeline_logs/release_creation.log
          import json, os, re, subprocess, glob

          TRANSLITERATE_MAP = {
              'ç': 'c', 'ã': 'a', 'õ': 'o', 'á': 'a', 'é': 'e',
              'í': 'i', 'ó': 'o', 'ú': 'u', 'ê': 'e', 'ô': 'o', 'à': 'a',
          }

          def slugify(name):
              lower = name.lower()
              for old, new in TRANSLITERATE_MAP.items():
                  lower = lower.replace(old, new)
              return re.sub(r'[^a-z0-9]+', '_', lower).strip('_')

          def load_cache(release_dir):
              cache_path = os.path.join(release_dir, '.summary_cache.json')
              if not os.path.exists(cache_path):
                  return None
              with open(cache_path) as f:
                  data = json.load(f)
              if 'summaries' not in data and 'category_summaries' in data:
                  data['summaries'] = data['category_summaries']
              return data

          # Warn operator if we're using the default GITHUB_TOKEN (issue #112)
          import os as _os
          token_hint = _os.environ.get('GH_TOKEN', '')
          if not token_hint or token_hint.startswith('ghs_'):
              print('⚠️  Using GITHUB_TOKEN (default).')
              print('    If releases fail with 422 "Cannot create ref", create a PAT')
              print('    with repo scope and add it as secret RELEASE_TOKEN.')
              print()

          # Get existing releases + their immutability status
          # gh release list doesn't expose immutable flag, so we inspect each
          # candidate via `gh release view` to detect immutability upfront.
          def fetch_release_detail(tag_name):
              r = subprocess.run(
                  ['gh', 'release', 'view', tag_name, '--json',
                   'tagName,databaseId,isImmutable,isDraft'],
                  capture_output=True, text=True,
              )
              if r.returncode == 0 and r.stdout.strip():
                  try:
                      return json.loads(r.stdout)
                  except json.JSONDecodeError:
                      return None
              return None

          result = subprocess.run(
              ['gh', 'release', 'list', '--json', 'tagName,body'],
              capture_output=True, text=True,
          )
          existing_tags = set()
          existing_ids = set()
          immutable_tags = set()
          if result.returncode == 0:
              for rel in json.loads(result.stdout):
                  existing_tags.add(rel.get('tagName', ''))
                  match = re.search(r'release_id.*?(\d+)', rel.get('body', ''))
                  if match:
                      existing_ids.add(int(match.group(1)))

          # Process ALL releases, not just the filtered one
          release_slug = os.environ.get('RELEASE_SLUG', '')
          if release_slug:
              slugs_to_process = [release_slug]
          else:
              slugs_to_process = sorted([
                  d for d in os.listdir('releases')
                  if os.path.isdir(os.path.join('releases', d))
                  and os.path.exists(os.path.join('releases', d, '.meta.json'))
              ])

          for slug in slugs_to_process:
              release_dir = f'releases/{slug}'
              meta_path = os.path.join(release_dir, '.meta.json')
              if not os.path.exists(meta_path):
                  continue

              with open(meta_path) as f:
                  meta = json.load(f)

              name = meta.get('name', slug)
              release_id = meta.get('release_id', 0)
              total = meta.get('total_features', sum(c.get('count', 0) for c in meta.get('categories', [])))
              cats_count = len(meta.get('categories', []))

              year_short = ''.join(filter(str.isdigit, slug.split('_')[-1]))
              season = slug.rsplit('_', 1)[0]
              tag = f'v{release_id}-{season}-{year_short}'

              # Load AI-generated summaries
              cache = load_cache(release_dir)

              if cache and cache.get('executive_summary'):
                  exec_summary = cache['executive_summary']
              else:
                  exec_summary = f'A release {name} traz {total} novos recursos em {cats_count} categorias.'

              # Build highlights
              highlights = []
              if cache:
                  summaries = cache.get('summaries', {})
                  for cat_name, summary in list(summaries.items())[:5]:
                      if isinstance(summary, str) and summary.strip():
                          first = summary.split('.')[0] + '.' if '.' in summary else summary[:200]
                          highlights.append(f'- **{cat_name}**: {first}')

              # Build category links
              cat_links = []
              for cat in meta.get('categories', []):
                  cat_name = cat.get('name', '')
                  count = cat.get('count', 0)
                  if count > 0:
                      cat_slug = slugify(cat_name)
                      cat_links.append(
                          f'- [📄 {cat_name} ({count} recursos)](./releases/{slug}/pt_BR/{cat_slug}.md)'
                      )

              # Build professional release notes
              nl = '\n'
              notes = f'## 📦 {name}{nl}{nl}'
              notes += f'{exec_summary}{nl}{nl}'

              if highlights:
                  notes += f'### 🌟 Destaques{nl}{nl}'
                  notes += f'{nl.join(highlights)}{nl}{nl}'

              notes += f'### 📊 Estatísticas{nl}'
              notes += f'| Métrica | Valor |{nl}'
              notes += f'| --- | --- |{nl}'
              notes += f'| Recursos | **{total}** |{nl}'
              notes += f'| Categorias | **{cats_count}** |{nl}{nl}'

              if cat_links:
                  notes += f'### 📄 Categorias{nl}{nl}'
                  notes += f'{nl.join(cat_links)}{nl}{nl}'

              notes += f'### 🔗 Links{nl}'
              notes += f'- [🇧🇷 Documentação pt_BR](./releases/{slug}/pt_BR/){nl}'
              notes += f'- [🇺🇸 Documentation en_US](./releases/{slug}/en_US/){nl}'
              notes += f'- [📚 Documentação Completa](./releases/{slug}/){nl}{nl}'
              notes += f'---{nl}'
              notes += f'*Gerado automaticamente pelo Salesforce Release Notes Pipeline*'

              # Check if this tag already exists and whether it's immutable.
              # We probe via `gh release view` instead of blindly trying to
              # delete, which previously surfaced 422s for immutable releases.
              detail = fetch_release_detail(tag) if tag in existing_tags else None
              if detail is not None:
                  if detail.get('isImmutable'):
                      print(f'⏭️ Release {tag} exists and is immutable — skipping update.')
                      immutable_tags.add(tag)
                      continue
                  # Not immutable: delete and recreate.
                  r_del = subprocess.run(
                      ['gh', 'release', 'delete', tag, '--yes'],
                      capture_output=True, text=True,
                  )
                  if r_del.returncode == 0:
                      subprocess.run(['git', 'tag', '-d', tag], capture_output=True)
                      print(f'🧹 Deleted release + git tag {tag} — will recreate.')
                  else:
                      print(f'  ⚠️ Could not delete {tag}: {r_del.stderr.strip()} — skipping.')
                      continue

              max_existing = max(existing_ids) if existing_ids else 0
              cmd = ['gh', 'release', 'create', tag, '--title', name, '--notes', notes]
              if release_id > max_existing:
                  cmd.append('--latest')

              print(f'📦 Creating release: {tag} ({name})')
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode == 0:
                  print(f'  ✅ Created: {tag}')
              else:
                  stderr = r.stderr.strip()
                  print(f'  ❌ stderr: {stderr[:500]}')
                  if 'immutable' in stderr or 'pre_receive' in stderr or '422' in stderr:
                      print(f'  ⏭️ Skipped {tag}: release/tag protection rule blocked creation.')
                      print(f'     Hint: review Settings → Rules → "Restrict or block tag creation"')
                  else:
                      print(f'  ❌ Failed: {stderr}')

          if immutable_tags:
              print()
              print(f'ℹ️  {len(immutable_tags)} release(s) were left as-is (immutable): {sorted(immutable_tags)}')
              print('   To replace them, manually delete via GitHub UI then re-run the pipeline.')

          PYEOF

      - name: Upload dos logs de execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: extract-logs
          path: /tmp/pipeline_logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Gerar sumário do pipeline
        if: always()
        run: |
          echo "## 📊 Sumário do Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```mermaid" >> $GITHUB_STEP_SUMMARY
          echo "flowchart LR" >> $GITHUB_STEP_SUMMARY
          echo "    A[Salesforce Help] -->|Playwright| B[Parser]" >> $GITHUB_STEP_SUMMARY
          echo "    B -->|FeatureImpact| C[Markdown]" >> $GITHUB_STEP_SUMMARY
          echo "    C -->|Generator| D[Releases]" >> $GITHUB_STEP_SUMMARY
          echo "    C -->|Updater| E[README]" >> $GITHUB_STEP_SUMMARY
          echo "    D -->|Jekyll| F[GitHub Pages]" >> $GITHUB_STEP_SUMMARY
          echo "    E -->|Jekyll| F" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parâmetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | \`${{ steps.params.outputs.dry_run }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | \`${{ steps.params.outputs.release_slug || 'todas' }}\` |" >> $GITHUB_STEP_SUMMARY

  create-issue:
    name: 📝 Issue com Diagnóstico de Falhas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: extract
    if: always() && needs.extract.result == 'failure'
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Baixar logs da extração
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: extract-logs
          path: /tmp/pipeline_logs/extract

      - name: Gerar corpo didático da issue
        id: body
        env:
          LOG_DIR: /tmp/pipeline_logs
          EXTRACT_RESULT: ${{ needs.extract.result }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 .github/scripts/build_failure_issue.py > /tmp/issue_body.md
          echo "body_file=/tmp/issue_body.md" >> $GITHUB_OUTPUT

      - name: Criar GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITLE="🚀 Release Notes Pipeline falhou — run ${{ github.run_id }}"
          BODY_FILE="${{ steps.body.outputs.body_file }}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "Issue já existe para este run — skipping."
            exit 0
          fi
          if gh issue create --title "$TITLE" --body-file "$BODY_FILE" 2>&1; then
            echo "Issue criada com sucesso."
          else
            echo "::warning::Falha ao criar issue com body-file, tentando com --body"
            gh issue create --title "$TITLE" --body "$(cat "$BODY_FILE")"
          fi
