# ╔══════════════════════════════════════════════════════════════════╗
# ║           🐍 Python Quality — Salesforce Release Notes           ║
# ║  Lint · Format · Types · Tests · Coverage — Python 3.13          ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Python Quality

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/uv-cache

# ─────────────────────────────────────────────────────────────────
# Shared setup — reused as a composite across all jobs
# ─────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  # ┌─────────────────────────────────────────────────────────────┐
  # │  🔍 RUFF — Linting                                          │
  # └─────────────────────────────────────────────────────────────┘
  ruff:
    name: 🔍 Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🔍 Run Ruff
        run: |
          echo ""
          printf '\033[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;36m  🔍  RUFF — Static Analysis & Linting\033[0m\n'
          printf '\033[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run ruff check . --output-format=full
          echo ""
          printf '\033[1;32m  ✅  Ruff passed — no issues found\033[0m\n'
          echo ""

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🎨 BLACK — Code formatting                                 │
  # └─────────────────────────────────────────────────────────────┘
  black:
    name: 🎨 Black Format
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🎨 Run Black
        run: |
          echo ""
          printf '\033[1;35m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;35m  🎨  BLACK — Code Formatting Check\033[0m\n'
          printf '\033[1;35m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run black --check --diff .
          echo ""
          printf '\033[1;32m  ✅  Black passed — code is properly formatted\033[0m\n'
          echo ""

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🔬 MYPY — Static type checking                             │
  # └─────────────────────────────────────────────────────────────┘
  mypy:
    name: 🔬 Mypy Types
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --extra healing --group dev

      - name: 🔬 Run Mypy
        run: |
          echo ""
          printf '\033[1;34m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;34m  🔬  MYPY — Static Type Checking\033[0m\n'
          printf '\033[1;34m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run mypy src/ --ignore-missing-imports --pretty
          echo ""
          printf '\033[1;32m  ✅  Mypy passed — no type errors\033[0m\n'
          echo ""

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🧪 PYTEST — Tests + Coverage                               │
  # │  Depends on: ruff, black, mypy (all quality gates pass)     │
  # └─────────────────────────────────────────────────────────────┘
  tests:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy]

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --extra healing --group dev

      - name: 🧪 Run tests with coverage
        run: |
          echo ""
          printf '\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;33m  🧪  PYTEST — Test Suite + Coverage Report\033[0m\n'
          printf '\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=95 \
            -v \
            --tb=short \
            --color=yes
          echo ""
          printf '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;32m  ✅  All tests passed — coverage ≥ 95%%\033[0m\n'
          printf '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ┌─────────────────────────────────────────────────────────────┐
  # │  📝 CREATE ISSUE ON FAILURE                                 │
  # └─────────────────────────────────────────────────────────────┘
  create-issue:
    name: 📝 Create Issue on Failure
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy, tests]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: Collect failure details
        id: collect
        run: |
          RUFF="${{ needs.ruff.result }}"
          BLACK="${{ needs.black.result }}"
          MYPY="${{ needs.mypy.result }}"
          TESTS="${{ needs.tests.result }}"
          echo "ruff=$RUFF" >> "$GITHUB_OUTPUT"
          echo "black=$BLACK" >> "$GITHUB_OUTPUT"
          echo "mypy=$MYPY" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

          mkdir -p /tmp/quality-logs

          echo "### Ruff" > /tmp/quality-logs/ruff.log
          uv run ruff check . --output-format=full > /tmp/quality-logs/ruff.log 2>&1 || true
          echo "### Black" > /tmp/quality-logs/black.log
          uv run black --check --diff . > /tmp/quality-logs/black.log 2>&1 || true
          echo "### Mypy" > /tmp/quality-logs/mypy.log
          uv run mypy src/ --ignore-missing-imports --pretty > /tmp/quality-logs/mypy.log 2>&1 || true
          echo "### Pytest" > /tmp/quality-logs/pytest.log
          uv run pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=95 -v --tb=short 2>&1 | tail -n 300 > /tmp/quality-logs/pytest.log || true

          # Prepare body (truncate to avoid API limits)
          {
            echo "BODY<<EOF"
            echo "## 🐍 Python Quality falhou — \`${{ github.sha }}\`"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\` · **Workflow:** [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| 🔍 Ruff | $RUFF |"
            echo "| 🎨 Black | $BLACK |"
            echo "| 🔬 Mypy | $MYPY |"
            echo "| 🧪 Tests & Coverage | $TESTS |"
            echo ""
            echo "### O que deve ser corrigido"
            echo ""
            if [ "$RUFF" != "success" ]; then echo "- [ ] Corrigir **Ruff** (\`uv run ruff check . --fix\`)"; echo '```'; head -n 80 /tmp/quality-logs/ruff.log; echo '```'; echo ""; fi
            if [ "$BLACK" != "success" ]; then echo "- [ ] Formatar com **Black** (\`uv run black .\`)"; echo '```'; head -n 80 /tmp/quality-logs/black.log; echo '```'; echo ""; fi
            if [ "$MYPY" != "success" ]; then echo "- [ ] Corrigir **Mypy** (\`uv run mypy src/\`)"; echo '```'; head -n 120 /tmp/quality-logs/mypy.log; echo '```'; echo ""; fi
            if [ "$TESTS" != "success" ]; then echo "- [ ] Corrigir **Tests / Coverage ≥95%** (\`uv run pytest --cov=src --cov-fail-under=95\`)"; echo '```'; head -n 200 /tmp/quality-logs/pytest.log; echo '```'; echo ""; fi
            echo ""
            echo "> Gerado automaticamente por Python Quality em \`$(date -u '+%Y-%m-%d %H:%M UTC')\`. Commit: \`${{ github.sha }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🐍 Python Quality falhou — ${{ github.sha }}"
          # Evita duplicatas para o mesmo commit: se já existe issue aberta com o SHA, não cria outra
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "Issue já existe para este commit — skipping."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "${{ steps.collect.outputs.BODY }}" --label "ci,quality"

  # ┌─────────────────────────────────────────────────────────────┐
  # │  📋 SUMMARY — Pipeline result dashboard                     │
  # └─────────────────────────────────────────────────────────────┘
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy, tests]
    if: always()

    steps:
      - name: 📋 Write job summary
        run: |
          RUFF="${{ needs.ruff.result }}"
          BLACK="${{ needs.black.result }}"
          MYPY="${{ needs.mypy.result }}"
          TESTS="${{ needs.tests.result }}"

          badge() {
            [ "$1" = "success" ] && echo "✅ passed" || echo "❌ failed"
          }

          echo "## 🐍 Python Quality — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Ruff Lint        | $(badge $RUFF)  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Black Format     | $(badge $BLACK) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Mypy Types       | $(badge $MYPY)  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests & Coverage | $(badge $TESTS) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$RUFF" == "success" && "$BLACK" == "success" && "$MYPY" == "success" && "$TESTS" == "success" ]]; then
            echo "### ✅ All quality gates passed — ready to merge!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ One or more quality gates failed — review required." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🐍 Python \`${{ env.PYTHON_VERSION }}\` · 📦 uv · 🕐 \`$(date -u '+%Y-%m-%d %H:%M UTC')\`" >> $GITHUB_STEP_SUMMARY
