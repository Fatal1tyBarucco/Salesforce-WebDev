# ╔══════════════════════════════════════════════════════════════════╗
# ║           🐍 Python Quality — Salesforce Release Notes           ║
# ║  Lint · Format · Types · Tests · Coverage — Python 3.13          ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Python Quality

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/uv-cache
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

# ─────────────────────────────────────────────────────────────────
# Shared setup — reused as a composite across all jobs
# ─────────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

jobs:
  # ┌─────────────────────────────────────────────────────────────┐
  # │  🔍 RUFF — Linting                                          │
  # └─────────────────────────────────────────────────────────────┘
  ruff:
    name: 🔍 Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔒 Check uv lockfile is in sync
        run: uv lock --check

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🔍 Run Ruff
        run: |
          echo ""
          printf '\033[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;36m  🔍  RUFF — Static Analysis & Linting\033[0m\n'
          printf '\033[1;36m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run ruff check . --output-format=full
          echo ""
          printf '\033[1;32m  ✅  Ruff passed — no issues found\033[0m\n'
          echo ""

      - name: Cache pytest / snapshots
        uses: actions/cache@v6.1.0
        with:
          path: tests/__snapshots__
          key: ${{ runner.os }}-snapshots-${{ hashFiles('tests/__snapshots__/*.ambr') }}
          restore-keys: ${{ runner.os }}-snapshots-

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🎨 BLACK — Code formatting                                 │
  # └─────────────────────────────────────────────────────────────┘
  black:
    name: 🎨 Black Format
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🎨 Run Black
        run: |
          echo ""
          printf '\033[1;35m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;35m  🎨  BLACK — Code Formatting Check\033[0m\n'
          printf '\033[1;35m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run black --check --diff .
          echo ""
          printf '\033[1;32m  ✅  Black passed — code is properly formatted\033[0m\n'
          echo ""

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🔬 MYPY — Static type checking                             │
  # └─────────────────────────────────────────────────────────────┘
  mypy:
    name: 🔬 Mypy Types
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --extra healing --group dev

      - name: 🔬 Run Mypy
        run: |
          echo ""
          printf '\033[1;34m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;34m  🔬  MYPY — Static Type Checking\033[0m\n'
          printf '\033[1;34m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run mypy src/ --ignore-missing-imports --pretty
          echo ""
          printf '\033[1;32m  ✅  Mypy passed — no type errors\033[0m\n'
          echo ""

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🧪 PYTEST — Tests + Coverage                               │
  # │  Depends on: ruff, black, mypy (all quality gates pass)     │
  # └─────────────────────────────────────────────────────────────┘
  tests:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy]

    steps:
      - name: ⬇️  Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          uv sync --frozen --extra dev --extra healing --group dev
          uv pip install "syrupy>=4.9.0,<5"

      - name: 🧪 Run tests with coverage
        run: |
          echo ""
          printf '\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;33m  🧪  PYTEST — Test Suite + Coverage Report\033[0m\n'
          printf '\033[1;33m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""
          uv run pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=95 \
            -v \
            --tb=short \
            --color=yes
          echo ""
          printf '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          printf '\033[1;32m  ✅  All tests passed — coverage ≥ 95%%\033[0m\n'
          printf '\033[1;32m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\033[0m\n'
          echo ""

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ┌─────────────────────────────────────────────────────────────┐
  # │  📝 CREATE ISSUE ON FAILURE                                 │
  # └─────────────────────────────────────────────────────────────┘
  create-issue:
    name: 📝 Create Issue on Failure
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy, tests]
    if: always() && (needs.ruff.result == 'failure' || needs.black.result == 'failure' || needs.mypy.result == 'failure' || needs.tests.result == 'failure')
    permissions:
      issues: write
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect failure details
        id: collect
        run: |
          RUFF="${{ needs.ruff.result }}"
          BLACK="${{ needs.black.result }}"
          MYPY="${{ needs.mypy.result }}"
          TESTS="${{ needs.tests.result }}"
          echo "ruff=$RUFF" >> "$GITHUB_OUTPUT"
          echo "black=$BLACK" >> "$GITHUB_OUTPUT"
          echo "mypy=$MYPY" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

          # Write body to file to avoid GH output quoting issues
          BODY_FILE="/tmp/issue_body.md"
          {
            echo "## 🐍 Python Quality falhou — \`${{ github.sha }}\`"
            echo ""
            echo "**Branch:** \`${{ github.ref_name }}\` · **Workflow:** [#${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| 🔍 Ruff | \`$RUFF\` |"
            echo "| 🎨 Black | \`$BLACK\` |"
            echo "| 🔬 Mypy | \`$MYPY\` |"
            echo "| 🧪 Tests & Coverage | \`$TESTS\` |"
            echo ""
            echo "### O que deve ser corrigido"
            echo ""
            if [ "$RUFF" = "failure" ]; then echo "- [ ] Corrigir **Ruff** \`uv run ruff check . --fix\`"; echo ""; fi
            if [ "$BLACK" = "failure" ]; then echo "- [ ] Formatar com **Black** \`uv run black .\`"; echo ""; fi
            if [ "$MYPY" = "failure" ]; then echo "- [ ] Corrigir **Mypy** \`uv run mypy src/\`"; echo ""; fi
            if [ "$TESTS" = "failure" ]; then echo "- [ ] Corrigir **Tests / Coverage ≥95%** \`uv run pytest --cov=src --cov-fail-under=95\`"; echo ""; fi
            echo ""
            echo "Logs completos em: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "> Gerado automaticamente por Python Quality em \`$(date -u '+%Y-%m-%d %H:%M UTC')\`. Commit: \`${{ github.sha }}\`"
          } > "$BODY_FILE"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Issue
        id: create-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TITLE="🐍 Python Quality falhou — ${{ github.sha }}"
          BODY_FILE="${{ steps.collect.outputs.body_file }}"
          # Evita duplicatas para o mesmo commit
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "Issue já existe para este commit — skipping."
            exit 0
          fi
          # Cria issue; captura URL para extrair número (gh nao tem --json number nesta versao)
          ISSUE_FILE="/tmp/issue_url.txt"
          NUMBER=""
          if OUTPUT=$(gh issue create --title "$TITLE" --body-file "$BODY_FILE" 2>/dev/null); then
            echo "Issue criada com sucesso."
            echo "$OUTPUT" > "$ISSUE_FILE"
            NUMBER=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -n1 || true)
          else
            echo "::warning::Falha ao criar issue com body-file, tentando com --body"
            if OUTPUT=$(gh issue create --title "$TITLE" --body "$(cat "$BODY_FILE")" 2>/dev/null); then
              echo "Issue criada com sucesso (fallback body)."
              echo "$OUTPUT" > "$ISSUE_FILE"
              NUMBER=$(echo "$OUTPUT" | grep -oE '[0-9]+' | tail -n1 || true)
            else
              echo "Falha ao criar issue." > "$ISSUE_FILE"
              NUMBER=""
            fi
          fi
          # Fallback: busca pelo título (se arquivo falhou)
          if [ -z "$NUMBER" ]; then
            NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          fi
          # Salva em arquivo de workspace (garante persistência entre steps do mesmo job)
          echo "$NUMBER" > /github/workspace/issue_number.txt
          if [ -n "$NUMBER" ]; then echo "issue_number=$NUMBER" >> "$GITHUB_OUTPUT"; echo "Issue número: $NUMBER"; else echo "issue_number=" >> "$GITHUB_OUTPUT"; echo "Número do issue não extraído."; fi

      - name: 💬 Comment /oc fix (only ruff/black)
        if: always() && (needs.ruff.result == 'failure' || needs.black.result == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.create-issue.outputs.issue_number }}
        run: |
          # Só comenta se o número do issue existe e a falha é apenas de lint/format
          # Tenta ler do env, depois do arquivo persistente no workspace
          ISSUE_NUM="${NUMBER:-}"
          if [ -z "$ISSUE_NUM" ] && [ -f /github/workspace/issue_number.txt ]; then
            ISSUE_NUM=$(cat /github/workspace/issue_number.txt | tr -d ' \n')
          fi
          if [ -z "$ISSUE_NUM" ]; then echo "Sem número do issue — skip."; exit 0; fi
          echo "Comentando no issue #$ISSUE_NUM com /oc fix only ruff/black..."
          # Usa comando específico, não genérico
          gh issue comment "$ISSUE_NUM" --body "/oc fix only ruff and black formatting. Skip mypy and tests." || echo "Comentário falhou (possível duplicata ou falta de permissão)."

  # ┌─────────────────────────────────────────────────────────────┐
  # │  📋 SUMMARY — Pipeline result dashboard                     │
  # └─────────────────────────────────────────────────────────────┘
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [ruff, black, mypy, tests]
    if: always()

    steps:
      - name: 📋 Write job summary
        run: |
          RUFF="${{ needs.ruff.result }}"
          BLACK="${{ needs.black.result }}"
          MYPY="${{ needs.mypy.result }}"
          TESTS="${{ needs.tests.result }}"

          badge() {
            [ "$1" = "success" ] && echo "✅ passed" || echo "❌ failed"
          }

          echo "## 🐍 Python Quality — ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Ruff Lint        | $(badge $RUFF)  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Black Format     | $(badge $BLACK) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Mypy Types       | $(badge $MYPY)  |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Tests & Coverage | $(badge $TESTS) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$RUFF" == "success" && "$BLACK" == "success" && "$MYPY" == "success" && "$TESTS" == "success" ]]; then
            echo "### ✅ All quality gates passed — ready to merge!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ One or more quality gates failed — review required." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🐍 Python \`${{ env.PYTHON_VERSION }}\` · 📦 uv · 🕐 \`$(date -u '+%Y-%m-%d %H:%M UTC')\`" >> $GITHUB_STEP_SUMMARY
