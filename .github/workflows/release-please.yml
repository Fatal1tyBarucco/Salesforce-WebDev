# ╔══════════════════════════════════════════════════════════════════╗
# ║           🚀 Release Please — Salesforce Release Notes           ║
# ║  Automated release PRs from Conventional Commits (Python)        ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Trigger: push to main branch
# Creates/updates a Release PR when feat:/fix: commits exist since last release
# Merge of Release PR → creates tag + GitHub Release automatically
# Publish (PyPI/Docker) is downstream gated on release_created output (future phase)
#
# Action pinned by immutable SHA: 5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 (v4)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Release Please

run-name: "🚀 Release Please — ${{ github.ref_name }} — ${{ github.sha }} — @${{ github.actor }}"

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Prevent concurrent Release Please runs on the same branch
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    name: 🚀 Release Please
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: 🚀 Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: python
          package-name: salesforce-release-notes
          bump-minor-pre-major: true
          bump-patch-for-minor-pre-major: true
          auto-merge: true
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: 📋 Release Created Summary
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.release.outputs.tag_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Name | ${{ steps.release.outputs.release_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release URL | ${{ steps.release.outputs.release_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> Release PR will be auto-merged when checks pass." >> $GITHUB_STEP_SUMMARY

      - name: ⚡ Setup uv
        if: steps.release.outputs.release_created == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🔒 Sync uv.lock after version bump
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "::group::🔒 Syncing uv.lock after release"
          uv lock
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          # Guard: lock may already be in sync (e.g. synced on the release PR)
          # — an empty `git commit` exits 1 and failed run 44580602662.
          if git diff --cached --quiet; then
            echo "uv.lock already in sync — nothing to commit."
          else
            git commit -m "chore: sync uv.lock after release-please version bump [skip ci]"
            git pull --rebase origin main
            git push
          fi
          echo "::endgroup::"

      - name: 📋 No Release Needed
        if: steps.release.outputs.release_created != 'true'
        run: |
          echo "## 🚀 Release Please" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> No new release needed — no feat:/fix: commits since last release." >> $GITHUB_STEP_SUMMARY

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🚀 Release Please Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Created | ${{ steps.release.outputs.release_created }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.release.outputs.tag_name || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Name | ${{ steps.release.outputs.release_name || 'n/a' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          echo 'flowchart LR' >> $GITHUB_STEP_SUMMARY
          echo '    A[Push to main] --> B[🚀 Release Please]' >> $GITHUB_STEP_SUMMARY
          echo '    B -->|feat:/fix: found| C[📦 Create Release PR]' >> $GITHUB_STEP_SUMMARY
          echo '    B -->|No changes| D[📋 Summary]' >> $GITHUB_STEP_SUMMARY
          echo '    C --> E[✅ Auto-merge]' >> $GITHUB_STEP_SUMMARY
          echo '    E --> F[🔒 Sync uv.lock]' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
