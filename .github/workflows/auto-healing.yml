# ─────────────────────────────────────────────────────────────────
# Auto-Healing Agent — GitHub Actions (Serverless)
# ─────────────────────────────────────────────────────────────────
# Triggered automatically when Python Quality fails on main.
# Strategy: bounded iterative repair — deterministic (known patterns)
#           first, then LLM fallback for semantic fixes — repeated
#           until all quality gates pass or the attempt budget runs out.
#
# Required secrets:
#   GOOGLE_API_KEY — Gemini API key for LLM analysis (fallback)
#   OPENCODE_API_KEY — OpenCode API key (second fallback)
# Optional repo vars:
#   OPENCODE_BASE_URL — OpenCode base URL (default https://opencode.ai/console/zen/v1)
#   OPENCODE_MODEL — OpenCode model id (default hy3-free)
#
# Hard limits (see timeout-minutes below) guarantee this workflow can
# NEVER run for hours on end: a single hung tool/LLM call is killed and
# the run terminates with a clear "manual intervention needed" verdict.
# ─────────────────────────────────────────────────────────────────

name: Auto-Healing Agent

on:
  workflow_run:
    workflows: ["Python Quality"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

# One auto-healing run per branch; cancel any older in-flight run for the
# same branch so we never pile up concurrent healers.
concurrency:
  group: auto-healing-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    # Absolute ceiling: this job can never exceed 45 minutes. The previous
    # design had no timeout, so a single hung LLM call (the Gemini SDK call
    # had no timeout) ran until GitHub's 6-hour limit — that is the "6 hours".
    timeout-minutes: 45
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event_name == 'workflow_run'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          source .github/scripts/spinner.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev
          uv sync --frozen --extra dev --extra healing --group dev &
          spin $! "Instalando dependências…"
          wait $!

      # ───────────────────────────────────────────────────────────
      # Detect whether an LLM provider is configured. Semantic fixes
      # (real implementations for failing tests) REQUIRE an LLM; if no
      # key is present we still apply deterministic fixes and report
      # clearly instead of hanging or silently producing no PR.
      # ───────────────────────────────────────────────────────────
      - name: Detect LLM availability
        id: detect
        env:
          GOOGLE: ${{ secrets.GOOGLE_API_KEY }}
          OPENCODE: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$GOOGLE" ] || [ -n "$OPENCODE" ]; then
            echo "llm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "llm_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No LLM API keys configured (GOOGLE_API_KEY / OPENCODE_API_KEY). Deterministic fixes only; semantic fixes require an LLM."
          fi

      # ───────────────────────────────────────────────────────────
      # Bounded iterative repair loop.
      # Each iteration: deterministic repair -> (if not green and LLM
      # available) LLM fallback -> deterministic re-format/import pass.
      # Stops as soon as all gates pass. The whole step is capped at
      # 35 minutes so a slow LLM/suite can never blow the 45-min job.
      # ───────────────────────────────────────────────────────────
      - name: Repair (deterministic + LLM, bounded)
        id: repair
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          LLM_AVAILABLE: ${{ steps.detect.outputs.llm_available }}
          MAX_REPAIR_ITERS: "4"
        run: |
          set -uo pipefail
          source .github/scripts/spinner.sh
          FINAL_PASS=false
          for i in $(seq 1 "${MAX_REPAIR_ITERS}"); do
            echo "::group::Iteration $i/${MAX_REPAIR_ITERS} — deterministic repair"
            uv run python3 .github/scripts/deterministic_repair.py &
            spin $! "Iteração $i/${MAX_REPAIR_ITERS} — reparo determinístico…"
            wait $!
            echo "::endgroup::"

            DET=$(python3 -c "import json;print(json.load(open('/tmp/deterministic_result.json')).get('all_pass'))" 2>/dev/null || echo False)
            if [ "$DET" = "True" ]; then FINAL_PASS=true; break; fi

            if [ "$LLM_AVAILABLE" != "true" ]; then
              echo "::warning::LLM unavailable — cannot apply semantic fixes. Stopping iterations."
              break
            fi

            echo "::group::Iteration $i/${MAX_REPAIR_ITERS} — LLM fallback"
            uv run python3 .github/scripts/llm_fallback.py &
            spin $! "Iteração $i/${MAX_REPAIR_ITERS} — fallback LLM…"
            wait $!; LLM_RC=$?
            [ "$LLM_RC" -ne 0 ] && echo "llm_fallback exited non-zero (rc=$LLM_RC)"
            echo "::endgroup::"

            echo "::group::Iteration $i/${MAX_REPAIR_ITERS} — re-format / re-import (deterministic)"
            uv run python3 .github/scripts/deterministic_repair.py &
            spin $! "Iteração $i/${MAX_REPAIR_ITERS} — re-formatação…"
            wait $!
            echo "::endgroup::"
            DET2=$(python3 -c "import json;print(json.load(open('/tmp/deterministic_result.json')).get('all_pass'))" 2>/dev/null || echo False)
            if [ "$DET2" = "True" ]; then FINAL_PASS=true; break; fi
          done
          echo "all_pass=${FINAL_PASS}" >> "$GITHUB_OUTPUT"

      # ───────────────────────────────────────────────────────────
      # Post-fix verification — MUST mirror the exact Python Quality
      # gates (ruff, black, mypy, pytest + 95% coverage) so the PR we
      # open actually passes Python Quality instead of being rejected.
      # ───────────────────────────────────────────────────────────
      - name: Post-fix verification
        id: verify
        timeout-minutes: 12
        run: |
          set +e
          source .github/scripts/spinner.sh
          uv run ruff check . >/dev/null 2>&1 &
          spin $! "Verificando Ruff…"; wait $!; RC=$?
          [ "$RC" -eq 0 ] && RUFF_OK=true || RUFF_OK=false
          uv run black --check . >/dev/null 2>&1 &
          spin $! "Verificando Black…"; wait $!; RC=$?
          [ "$RC" -eq 0 ] && BLACK_OK=true || BLACK_OK=false
          uv run mypy src/ --ignore-missing-imports >/dev/null 2>&1 &
          spin $! "Verificando Mypy…"; wait $!; RC=$?
          [ "$RC" -eq 0 ] && MYPY_OK=true || MYPY_OK=false
          # Mirror Python Quality exactly: tests AND 95% coverage.
          uv run pytest tests/ -q --tb=short \
            --cov=src --cov-report=term-missing --cov-fail-under=95 >/dev/null 2>&1 &
          spin $! "Executando Pytest + cobertura (≥95%)…"; wait $!; RC=$?
          [ "$RC" -eq 0 ] && PYTEST_OK=true || PYTEST_OK=false

          echo "ruff=$RUFF_OK" >> "$GITHUB_OUTPUT"
          echo "black=$BLACK_OK" >> "$GITHUB_OUTPUT"
          echo "mypy=$MYPY_OK" >> "$GITHUB_OUTPUT"
          echo "pytest=$PYTEST_OK" >> "$GITHUB_OUTPUT"

          if [ "$RUFF_OK" = "true" ] && [ "$BLACK_OK" = "true" ] && [ "$MYPY_OK" = "true" ] && [ "$PYTEST_OK" = "true" ]; then
            echo "all_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_pass=false" >> "$GITHUB_OUTPUT"
          fi

      # ───────────────────────────────────────────────────────────
      # Create PR only when verification is fully green AND there are
      # actual changes to commit.
      # ───────────────────────────────────────────────────────────
      - name: Create PR
        id: pr
        if: steps.verify.outputs.all_pass == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/spinner.sh
          # Nothing to commit?
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          BRANCH="auto-fix/${RUN_ID}"
          DET_COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/deterministic_result.json')).get('fixes_applied', [])))" 2>/dev/null || echo 0)

          git checkout -b "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Auto-Healing Agent"
          git config user.email "agent@github.com"

          MSG="[auto-heal] fix: quality gates (deterministic + LLM)"
          git commit -m "$MSG"
          git push origin "$BRANCH" &
          spin $! "Enviando branch e abrindo PR…"
          wait $!

          FIXES_LIST=""
          if [ -f /tmp/deterministic_result.json ]; then
            FIXES_LIST=$(python3 -c "
          import json
          d = json.load(open('/tmp/deterministic_result.json'))
          for f in d.get('fixes_applied', []):
              print(f'- \`{f}\`')
          " 2>/dev/null || echo "")
          fi

          GATES_TABLE=""
          if [ -f /tmp/deterministic_result.json ]; then
            GATES_TABLE=$(python3 -c "
          import json
          d = json.load(open('/tmp/deterministic_result.json'))
          for gate, ok in d.get('gate_results', {}).items():
              icon = '✅' if ok else '❌'
              print(f'- {icon} {gate}')
          " 2>/dev/null || echo "")
          fi

          BODY=$(cat <<EOF
          ## 🔧 Auto-Healing: CI/CD Pipeline Fix

          **Failed Workflow Run:** [#${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID})
          **Strategy:** Deterministic + LLM fallback (bounded iterations)

          ### Fixes Applied
          ${FIXES_LIST}

          ### Verification (all gates pass)
          ${GATES_TABLE}

          ---
          _This PR was generated automatically by the Auto-Healing Agent._
          EOF
          )

          gh pr create \
            --title "🔧 Auto-Heal: ${MSG}" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main

          echo "pr_created=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "✅ PR created from branch ${BRANCH}"

      - name: Summary
        if: always()
        run: |
          VERIFY_PASS="${{ steps.verify.outputs.all_pass }}"
          PR_CREATED="${{ steps.pr.outputs.pr_created }}"

          {
            echo "## 🤖 Auto-Healing Agent Summary"
            echo ""
            echo "- **Triggered by:** Workflow Run #${{ github.event.workflow_run.id }}"
            echo "- **Conclusion:** ${{ github.event.workflow_run.conclusion }}"
            echo "- **LLM available:** ${{ steps.detect.outputs.llm_available }}"
            echo ""
            echo "### Post-Fix Verification"
            echo "- Ruff: ${{ steps.verify.outputs.ruff }}"
            echo "- Black: ${{ steps.verify.outputs.black }}"
            echo "- Mypy: ${{ steps.verify.outputs.mypy }}"
            echo "- Pytest (+coverage): ${{ steps.verify.outputs.pytest }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERIFY_PASS" = "true" ] && [ "$PR_CREATED" = "true" ]; then
            echo "- **Status:** ✅ PR created (\`${{ steps.pr.outputs.branch }}\`)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$VERIFY_PASS" = "true" ]; then
            echo "- **Status:** ✅ All gates pass (no changes required)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** ❌ Could not fix all errors — manual intervention needed" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.detect.outputs.llm_available }}" != "true" ]; then
              echo "- **Likely cause:** No LLM API key configured. Semantic fixes (real implementations for failing tests) require GOOGLE_API_KEY or OPENCODE_API_KEY." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::Auto-Healing could not make all Python Quality gates pass."
            exit 1
          fi
