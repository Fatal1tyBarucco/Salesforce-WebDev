# ─────────────────────────────────────────────────────────────────
# Auto-Healing Agent — GitHub Actions (Serverless)
# ─────────────────────────────────────────────────────────────────
# Triggered automatically when Python Quality fails on main.
# Strategy: deterministic repair first (known patterns), then LLM fallback.
#
# Required secrets:
#   GOOGLE_API_KEY — Gemini API key for LLM analysis (fallback)
#   OPENCODE_API_KEY — OpenCode API key (second fallback)
# Optional repo vars:
#   OPENCODE_BASE_URL — OpenCode base URL (default https://opencode.ai/console/zen/v1)
#   OPENCODE_MODEL — OpenCode model id (default hy3-free)
# ─────────────────────────────────────────────────────────────────

name: Auto-Healing Agent

on:
  workflow_run:
    workflows: ["Python Quality"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-healing-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event_name == 'workflow_run'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev
          uv sync --frozen --extra dev --extra healing --group dev

      # ───────────────────────────────────────────────────────────
      # STEP 1: Deterministic repair — fix known error patterns
      # ───────────────────────────────────────────────────────────
      - name: Deterministic repair
        id: deterministic
        run: uv run python3 .github/scripts/deterministic_repair.py

      # ───────────────────────────────────────────────────────────
      # STEP 2: LLM fallback — only if deterministic didn't fully fix
      # ───────────────────────────────────────────────────────────
      - name: LLM fallback repair
        id: llm_fix
        if: steps.deterministic.outputs.all_pass != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
        run: uv run python3 .github/scripts/llm_fallback.py

      # ───────────────────────────────────────────────────────────
      # STEP 3: Create PR if any fixes were applied
      # ───────────────────────────────────────────────────────────
      - name: Create PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if there are changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          BRANCH="auto-fix/${RUN_ID}"
          DET_COUNT="${{ steps.deterministic.outputs.fixes_count }}"
          DET_PASS="${{ steps.deterministic.outputs.all_pass }}"

          git checkout -b "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "No staged changes."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Auto-Healing Agent"
          git config user.email "agent@github.com"

          if [ "$DET_PASS" = "true" ]; then
            MSG="[auto-heal] fix: deterministic repair (${DET_COUNT} fixes, all gates pass)"
          else
            MSG="[auto-heal] fix: deterministic + LLM repair"
          fi

          git commit -m "$MSG"
          git push origin "$BRANCH"

          # Build PR body
          FIXES_LIST=""
          if [ -f /tmp/deterministic_result.json ]; then
            FIXES_LIST=$(uv run python3 -c "
          import json
          d = json.load(open('/tmp/deterministic_result.json'))
          for f in d.get('fixes_applied', []):
              print(f'- \`{f}\`')
          " 2>/dev/null || echo "")
          fi

          GATES_TABLE=""
          if [ -f /tmp/deterministic_result.json ]; then
            GATES_TABLE=$(uv run python3 -c "
          import json
          d = json.load(open('/tmp/deterministic_result.json'))
          for gate, ok in d.get('gate_results', {}).items():
              icon = '✅' if ok else '❌'
              print(f'- {icon} {gate}')
          " 2>/dev/null || echo "")
          fi

          BODY=$(cat <<EOF
          ## 🔧 Auto-Healing: CI/CD Pipeline Fix

          **Failed Workflow Run:** [#${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID})
          **Strategy:** $([ "$DET_PASS" = "true" ] && echo "Deterministic repair" || echo "Deterministic + LLM fallback")

          ### Fixes Applied
          ${FIXES_LIST}

          ### Verification
          ${GATES_TABLE}

          ---
          _This PR was generated automatically by the Auto-Healing Agent._
          EOF
          )

          gh pr create \
            --title "🔧 Auto-Heal: ${MSG}" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main

          echo "pr_created=true" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "✅ PR created from branch ${BRANCH}"

      - name: Summary
        if: always()
        run: |
          DET_COUNT="${{ steps.deterministic.outputs.fixes_count }}"
          DET_PASS="${{ steps.deterministic.outputs.all_pass }}"
          PR_CREATED="${{ steps.pr.outputs.pr_created }}"

          {
            echo "## 🤖 Auto-Healing Agent Summary"
            echo ""
            echo "- **Triggered by:** Workflow Run #${{ github.event.workflow_run.id }}"
            echo "- **Conclusion:** ${{ github.event.workflow_run.conclusion }}"
            echo ""
            echo "### Deterministic Repair"
            echo "- Fixes applied: ${DET_COUNT}"
            echo "- All gates pass: ${DET_PASS}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DET_PASS" != "true" ] && [ -f /tmp/llm_result.json ]; then
            LLM_SUCCESS=$(uv run python3 -c "import json; print(json.load(open('/tmp/llm_result.json')).get('success'))" 2>/dev/null || echo "unknown")
            echo "### LLM Fallback" >> "$GITHUB_STEP_SUMMARY"
            echo "- LLM result: ${LLM_SUCCESS}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$PR_CREATED" = "true" ]; then
            echo "- **Status:** ✅ PR created (\`${{ steps.pr.outputs.branch }}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** ⏭️ No PR created" >> "$GITHUB_STEP_SUMMARY"
          fi
