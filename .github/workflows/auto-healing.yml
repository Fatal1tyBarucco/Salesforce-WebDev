# ─────────────────────────────────────────────────────────────────[...]
# Auto-Healing Agent — GitHub Actions (Serverless)
# ─────────────────────────────────────────────────────────────────[...]
# Triggered automatically when Python Quality fails on main.
# No webhook server needed — runs entirely on GitHub Actions.
#
# Required secret:
#   GOOGLE_API_KEY — Gemini API key for LLM analysis
# ─────────────────────────────────────────────────────────────────[...]

name: Auto-Healing Agent

on:
  workflow_run:
    workflows: ["Python Quality"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-healing-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    # Only run when the workflow failed on the main branch
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event_name == 'workflow_run'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-dev libxslt1-dev
          uv sync --frozen --extra dev --extra healing --group dev

      - name: Download failure logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "📥 Downloading logs for run ${RUN_ID}..."

          # Download logs via GitHub API (curl is more reliable than gh api for binary)
          HTTP_CODE=$(curl -sL -o logs.zip -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/logs")

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ Failed to download logs (HTTP $HTTP_CODE)"
            echo "log_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f logs.zip ]] || [[ ! -s logs.zip ]]; then
            echo "⚠️ Log archive is empty or missing"
            echo "log_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p logs_extracted
          if ! unzip -o logs.zip -d logs_extracted 2>&1; then
            echo "❌ Failed to extract log archive"
            echo "log_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Concatenate all log files
          LOG_TEXT=""
          for f in logs_extracted/**/*.txt; do
            if [[ -f "$f" ]]; then
              LOG_TEXT="${LOG_TEXT}$(cat "$f")\n"
            fi
          done

          if [[ -z "$LOG_TEXT" ]]; then
            echo "⚠️ No log content found in archive"
            echo "log_lines=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Save to file (truncate if too long)
          echo -e "$LOG_TEXT" | head -c 30000 > /tmp/failure_log.txt
          echo "log_lines=$(wc -l < /tmp/failure_log.txt)" >> "$GITHUB_OUTPUT"
          echo "✅ Logs downloaded ($(wc -l < /tmp/failure_log.txt) lines)"

          # Generate repository file list for LLM context
          find . -type f -not -path './.git/*' | head -100 > /tmp/repo_files.txt
          echo "✅ Repository file list generated ($(wc -l < /tmp/repo_files.txt) files)"

      - name: Analyze failure with Gemini
        id: analyze
        if: steps.logs.outputs.log_lines != '0'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python3 << 'PYEOF'
          import json
          import os
          from google import genai

          api_key = os.environ.get("GOOGLE_API_KEY", "")
          if not api_key:
              print("❌ GOOGLE_API_KEY not set")
              exit(0)

          with open("/tmp/repo_files.txt") as f:
              repo_context = f.read().strip() or "No files found in repository."
          with open("/tmp/failure_log.txt") as f:
              log_text = f.read()

          client = genai.Client(api_key=api_key)

          prompt = (
              "Here are the files in the repository:\n"
              + repo_context
              + "\n\n"
              "You are an expert DevOps engineer and Python developer. Analyze a CI/CD failure log and identify the EXACT file that needs correction.\n"
              "CRITICAL INSTRUCTIONS:\n"
              "1. READ the failure log carefully to find the SPECIFIC file path that has the error.\n"
              "2. Look for patterns like: 'error in <file>', 'File \"<file>\"', line', 'would reformat <file>', 'error: <file>:<line>'\n"
              "3. The affected_file_path MUST match a file path that appears in the failure log.\n"
              "4. Do NOT guess or hallucinate a file path - it must come from the log.\n"
              "5. If the failure lists BOTH a source module and its test (e.g. src/llm_service.py and tests/test_llm_service.py), fix the SOURCE module, not the test.\n"
              "6. Fix EVERY file that appears in the failure log with an error (ruff, black, mypy, or pytest). Do NOT fix only one of them - all error files must be corrected in the SAME response.\n"
              "Respond with ONLY a valid JSON object (no markdown fences):\n"
              "{\n"
              '    "root_cause_summary": "one paragraph summary",\n'
              '    "explanation": "what was changed and why",\n'
              '    "files": [\n'
              '        {"affected_file_path": "relative/path/to/file.py", "corrected_code": "full corrected file content"}\n'
              "    ]\n"
              "}\n"
              "Rules:\n"
              "- files MUST contain EVERY file reported with errors in the failure log (ruff, black, mypy, or pytest). Fix them ALL.\n"
              "- corrected_code for each file must be the COMPLETE file, not a diff\n"
              "- Ensure corrected_code is valid Python\n"
              "- Preserve all existing functionality\n"
              "- corrected_code MUST pass the project's Python Quality gate: ruff lint clean, black formatting clean, mypy strict typing (no new type errors), and existing pytest tests still pass\n"
              "- Do NOT introduce new lint errors, formatting issues, type errors, or failing tests\n"
              "Failed Workflow Log:\n"
              "```\n"
              + log_text[:25000]
              + "\n```"
          )

          try:
              response = client.models.generate_content(
                  model="gemini-3.6-flash",
                  contents=prompt,
              )

              raw = response.text.strip()
              # Clean markdown fences
              import re
              raw = re.sub(r"^```(?:json)?\s*\n?", "", raw, flags=re.MULTILINE)
              raw = re.sub(r"\n?```\s*$", "", raw, flags=re.MULTILINE)
              raw = raw.strip()

              result = json.loads(raw)

              root_cause = result.get("root_cause_summary", "") or ""
              explanation = result.get("explanation", "") or ""

              # Accept the new `files` array, or fall back to the legacy
              # single-file form for backward compatibility.
              raw_files = result.get("files")
              if not isinstance(raw_files, list) or not raw_files:
                  single_path = result.get("affected_file_path")
                  single_code = result.get("corrected_code")
                  if single_path and single_code:
                      raw_files = [{"affected_file_path": single_path, "corrected_code": single_code}]
                  else:
                      raw_files = []

              if not raw_files:
                  print("❌ No files to fix in response")
                  exit(0)

              # Validate each entry and prefer the source module over its test
              files = []
              for entry in raw_files:
                  path = entry.get("affected_file_path", "")
                  code = entry.get("corrected_code", "")
                  if not path or not code:
                      print(f"⚠️ Skipping invalid entry (missing path or code): {entry}")
                      continue
                  if path.startswith("tests/") and path.endswith(".py"):
                      src_name = os.path.basename(path)
                      if src_name.startswith("test_"):
                          src_name = src_name[len("test_"):]
                      candidate = os.path.join("src", src_name)
                      if os.path.exists(candidate):
                          print(f"Remapping test file {path} -> source {candidate}")
                          path = candidate
                  files.append({"affected_file_path": path, "corrected_code": code})

              if not files:
                  print("❌ No valid files with corrected_code in response")
                  exit(0)

              # Save outputs
              with open("/tmp/analysis.json", "w") as f:
                  json.dump({"root_cause_summary": root_cause, "explanation": explanation, "files": files}, f)

              # Write outputs for GitHub Actions
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write(f"file_path={files[0]['affected_file_path']}\n")
                  f.write(f"file_count={len(files)}\n")
                  f.write(f"summary={root_cause[:200]}\n")

              print(f"✅ Analysis complete: {len(files)} file(s) to fix")
              for fobj in files:
                  print(f"   - {fobj['affected_file_path']}")
              if root_cause:
                  print(f"   Root cause: {root_cause[:100]}...")

          except json.JSONDecodeError as e:
              print(f"❌ Failed to parse LLM response as JSON: {e}")
              print(f"   Raw response: {raw[:500]}")
          except Exception as e:
              print(f"❌ LLM analysis failed: {e}")
          PYEOF

      - name: Apply fix and create PR
        id: fix
        if: steps.analyze.outputs.file_path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read analysis
          SUMMARY=$(uv run python3 -c "import json; d=json.load(open('/tmp/analysis.json')); print((d.get('root_cause_summary') or '')[:72])")
          EXPLANATION=$(uv run python3 -c "import json; d=json.load(open('/tmp/analysis.json')); print(d.get('explanation') or '')")
          FILE_COUNT=$(uv run python3 -c "import json; print(len(json.load(open('/tmp/analysis.json')).get('files', [])))")
          FILES_LIST=$(uv run python3 -c "import json; print(', '.join(e['affected_file_path'] for e in json.load(open('/tmp/analysis.json')).get('files', [])))")
          RUN_ID="${{ github.event.workflow_run.id }}"

          # Create branch
          BRANCH="auto-fix/${RUN_ID}"
          git checkout -b "$BRANCH"

          # Apply EVERY corrected file listed in the analysis. All error files
          # reported by Python Quality are fixed together in the same PR.
          echo "📝 Applying fixes to all ${FILE_COUNT} file(s) reported with errors..."
          uv run python3 -c "import json,os; [ (os.makedirs(os.path.dirname(e['affected_file_path']) or '.', exist_ok=True), open(e['affected_file_path'],'w').write(e['corrected_code'])) for e in json.load(open('/tmp/analysis.json')).get('files', []) ]"

          # ── Enforce code quality on every changed file so Python Quality passes ──
          # Deterministically reformat and auto-fix each file so the most common
          # failure modes (black formatting and ruff lint) can never re-trigger the
          # pipeline after the PR is merged.
          echo "🛠️  Enforcing code quality on all changed files..."
          uv run python3 -c "import json,subprocess; [ [subprocess.run(['uv','run','black',e['affected_file_path']],check=False), subprocess.run(['uv','run','ruff','check','--fix',e['affected_file_path']],check=False), subprocess.run(['uv','run','ruff','format',e['affected_file_path']],check=False)] for e in json.load(open('/tmp/analysis.json')).get('files', []) ]"

          # Stage only the files we intentionally changed
          for f in $(uv run python3 -c "import json; print(' '.join(e['affected_file_path'] for e in json.load(open('/tmp/analysis.json')).get('files', [])))"); do
            git add "$f"
          done

          # ── Verification gate: guarantee Python Quality passes ──
          # Replicate the exact Python Quality checks (ruff, black, mypy, pytest) on
          # the whole repository. If any check fails, abort the PR so we never open a
          # change that re-breaks the pipeline (which would cause an infinite
          # auto-heal loop). This guarantees Python Quality runs without errors after
          # the refactor.
          echo "🔍 Verifying Python Quality before opening PR..."
          set +e
          QUALITY_OK=1

          uv run ruff check . --output-format=full
          if [ $? -ne 0 ]; then echo "❌ ruff failed"; QUALITY_OK=0; fi

          uv run black --check .
          if [ $? -ne 0 ]; then echo "❌ black failed"; QUALITY_OK=0; fi

          uv run mypy src/ --ignore-missing-imports --pretty 2>&1 | tail -30
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "❌ mypy failed"; QUALITY_OK=0; fi

          uv run pytest tests/ --cov=src --cov-fail-under=95 -q 2>&1 | tail -40
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "❌ pytest failed"; QUALITY_OK=0; fi

          set -e
          if [ "$QUALITY_OK" -ne 1 ]; then
            echo "❌ Python Quality did NOT pass after applying the fixes."
            echo "   Aborting PR to avoid an auto-heal failure loop."
            echo "   Inspect the logs above and fix the change manually if needed."
            exit 0
          fi
          echo "✅ Python Quality verified — all checks green."

          # Check if there are changes
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          # Commit
          git config user.name "Auto-Healing Agent"
          git config user.email "agent@github.com"
          git commit -m "[auto-heal] fix: ${SUMMARY}"

          # Push
          git push origin "$BRANCH"

          # Create PR
          BODY="## 🔧 Auto-Healing: CI/CD Pipeline Fix

          **Failed Workflow Run:** [#${RUN_ID}](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID})
          **Affected Files (${FILE_COUNT}):** \`${FILES_LIST}\`

          ### Root Cause
          ${SUMMARY}

          ### Changes Applied
          ${EXPLANATION}

          ---
          _This PR was generated automatically by the Auto-Healing Agent._
          _The fix will be validated by the agent-validation workflow._"

          gh pr create \
            --title "🔧 Auto-Heal: ${SUMMARY}" \
            --body "$BODY" \
            --head "$BRANCH" \
            --base main

          echo "✅ PR created from branch ${BRANCH}"
          if [ -n "$GITHUB_OUTPUT" ]; then echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"; fi

      - name: Summary
        if: always()
        run: |
          echo "## 🤖 Auto-Healing Agent Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** Workflow Run #${{ github.event.workflow_run.id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Conclusion:** ${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_STEP_SUMMARY"
          
          if [[ -n "${{ steps.analyze.outputs.file_path }}" ]]; then
            echo "- **File analyzed:** \`${{ steps.analyze.outputs.file_path }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Root cause:** ${{ steps.analyze.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          if [[ -n "${{ steps.fix.outputs.branch }}" ]]; then
            echo "- **PR branch:** \`${{ steps.fix.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Status:** ✅ PR created" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** ⏭️ No fix applied" >> "$GITHUB_STEP_SUMMARY"
          fi
