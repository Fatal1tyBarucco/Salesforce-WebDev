name: "Dependency Review"

run-name: "🔍 Dependency Review — #${{ github.event.pull_request.number }} — @${{ github.actor }}"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dep-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 🔍 Review Dependency Changes
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0

      - name: 📋 Summary
        if: always()
        run: |
          echo "## 🔍 Dependency Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dependency changes reviewed for security vulnerabilities and license compliance." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerabilities | \`fail-on-severity: high\` |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | \`deny: GPL-3.0, AGPL-3.0\` |" >> $GITHUB_STEP_SUMMARY
          echo "| PR Comment | \`always\` |" >> $GITHUB_STEP_SUMMARY
