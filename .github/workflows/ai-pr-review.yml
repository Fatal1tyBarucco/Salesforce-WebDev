# ╔══════════════════════════════════════════════════════════════════╗
# ║           🤖 AI PR Review — Salesforce Release Notes             ║
# ║  Code review automatizado via Claude Code (segurança, perf, UX)  ║
# ╚══════════════════════════════════════════════════════════════════╝

name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: /tmp/uv-cache

jobs:
  # ┌─────────────────────────────────────────────────────────────┐
  # │  🤖 CLAUDE CODE REVIEW                                      │
  # │  Usa anthropics/claude-code-action para revisar PR          │
  # └─────────────────────────────────────────────────────────────┘
  claude-review:
    name: 🤖 Claude Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🤖 Run Claude Code Review
        uses: anthropics/claude-code-action@3b9e5c7f5e8b4d2a1c6f7e8d9a0b1c2d3e4f5a6b # v1.0.0 (SHA placeholder - substituir por SHA real)
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Instruções baseadas nos subagentes code-reviewer + security-auditor
          prompt: |
            Você é um revisor de código sênior para o projeto Salesforce-WebDev.
            Revise este PR seguindo as diretrizes de AGENTS.md e CLAUDE.md.

            Foco obrigatório:
            1. **Segurança**: input validation (Pydantic), sem segredos, rate limiting, prompt injection
            2. **Performance**: I/O async, concorrência controlada (Semaphore), cache, prompt size
            3. **Padrões**: Ruff format, type hints 100%, DI explícita, null-safe (except (A,B) as e:)
            4. **Clean Architecture**: domain/services/infrastructure/entrypoints, Pydantic nas fronteiras
            5. **Testes**: golden files para comportamento determinístico, contract tests para LLM

            NÃO elogie — apenas reporte problemas com severidade (CRÍTICO/ALTO/MÉDIO/BAIXO).
            Formato: "### [SEVERIDADE] arquivo:linha — descrição"

            Se for menção @claude em issue: faça triagem (labels, prioridade, duplicatas, info faltante).
          # Limitar a arquivos alterados no PR
          include: "src/**/*.py,tests/**/*.py,.github/workflows/*.yml,pyproject.toml,.pre-commit-config.yaml"
          # Não revisar docs (tem workflow próprio)
          exclude: "docs/**,README*.md,CHANGELOG.md"

      - name: 📋 Post review summary
        if: always()
        run: |
          echo "## 🤖 AI PR Review Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Revisão baseada nos subagentes: code-reviewer + security-auditor" >> $GITHUB_STEP_SUMMARY
          echo "Ver comentários no PR para detalhes." >> $GITHUB_STEP_SUMMARY

  # ┌─────────────────────────────────────────────────────────────┐
  # │  🔒 SECURITY AUDIT (pip-audit, gitleaks, dependency-review) │
  # └─────────────────────────────────────────────────────────────┘
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: 🔍 pip-audit
        run: |
          uv export --frozen --no-emit-project --no-hashes | uvx pip-audit -r /dev/stdin --format json -o pip-audit-report.json || true
          cat pip-audit-report.json | jq '.vulnerabilities | length' || echo "0"

      - name: 🔍 gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --exit-code 0
          cat gitleaks-report.json | jq 'length' || echo "0"

      - name: 📋 Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            gitleaks-report.json
          retention-days: 30

  # ┌─────────────────────────────────────────────────────────────┐
  # │  📋 SUMMARY                                                 │
  # └─────────────────────────────────────────────────────────────┘
  summary:
    name: 📋 AI Review Summary
    runs-on: ubuntu-latest
    needs: [claude-review, security-audit]
    if: always()
    permissions:
      contents: read
    steps:
      - name: 📋 Write summary
        run: |
          echo "## 🤖 AI PR Review — ${{ github.event.pull_request.number || github.event.issue.number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Claude Code Review | ${{ needs.claude-review.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Subagentes: code-reviewer + security-auditor | Trigger: @claude mention ou PR aberto" >> $GITHUB_STEP_SUMMARY