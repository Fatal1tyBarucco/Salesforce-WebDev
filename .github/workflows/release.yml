name: "Release"

on:
  workflow_run:
    workflows: ["🚀 Salesforce Release Notes Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  release:
    name: Create Releases
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Collect all releases metadata
        id: release_info
        run: |
          ALL_METAS=$(find releases -mindepth 2 -maxdepth 2 -name '.meta.json' 2>/dev/null | sort)
          if [ -z "$ALL_METAS" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build JSON array of all releases
          RELEASES_JSON=$(python3 -c "
          import json, os, glob
          metas = sorted(glob.glob('releases/*/.meta.json'))
          releases = []
          for m in metas:
              with open(m) as f:
                  data = json.load(f)
              slug = data.get('slug', os.path.basename(os.path.dirname(m)))
              name = data.get('name', slug)
              features = data.get('total_features', sum(c.get('count', 0) for c in data.get('categories', [])))
              date = data.get('generated_at', '')
              cats = len(data.get('categories', []))
              rid = data.get('release_id', 0)
              year_short = ''.join(filter(str.isdigit, slug.split('_')[-1]))
              season = slug.rsplit('_', 1)[0]
              tag = f'v20{year_short}-{season}'
              releases.append({
                  'slug': slug, 'name': name, 'features': features,
                  'date': date, 'categories': cats, 'release_id': rid,
                  'tag_name': tag
              })
          print(json.dumps(releases))
          ")

          echo "releases_json=$RELEASES_JSON" >> $GITHUB_OUTPUT
          echo "has_release=true" >> $GITHUB_OUTPUT
          echo "release_count=$(echo "$RELEASES_JSON" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" >> $GITHUB_OUTPUT

      - name: Get existing GitHub Releases
        if: steps.release_info.outputs.has_release == 'true'
        id: get_existing_releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_RELEASES=$(gh release list --json tagName,body 2>/dev/null || echo '[]')
          EXISTING_DATA=$(echo "$EXISTING_RELEASES" | python3 -c "
          import json, sys, re
          releases = json.load(sys.stdin)
          ids = set()
          tags = set()
          for release in releases:
              tags.add(release.get('tagName', ''))
              body = release.get('body', '')
              match = re.search(r'release_id.*?(\d+)', body)
              if match:
                  ids.add(int(match.group(1)))
          print(json.dumps({'ids': sorted(ids), 'tags': sorted(tags)}))
          ")
          echo "existing_data=$EXISTING_DATA" >> $GITHUB_OUTPUT

      - name: Generate and create releases for ALL versions
        if: steps.release_info.outputs.has_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, subprocess, sys

          releases_json = os.environ.get('RELEASES_JSON', '[]')
          existing_data_raw = os.environ.get('EXISTING_DATA', '{"ids":[],"tags":[]}')

          releases = json.loads(releases_json)
          existing_data = json.loads(existing_data_raw)
          existing_tags = set(existing_data.get('tags', []))
          existing_ids = set(existing_data.get('ids', []))

          TRANSLITERATE_MAP = {
              'ç': 'c', 'ã': 'a', 'õ': 'o', 'á': 'a', 'é': 'e',
              'í': 'i', 'ó': 'o', 'ú': 'u', 'ê': 'e', 'ô': 'o', 'à': 'a',
          }

          def slugify(name):
              """Transliterate PT chars and slugify."""
              lower = name.lower()
              for old, new in TRANSLITERATE_MAP.items():
                  lower = lower.replace(old, new)
              return re.sub(r'[^a-z0-9]+', '_', lower).strip('_')

          def load_cache(release_dir):
              """Load summary cache, normalizing key names."""
              cache_path = os.path.join(release_dir, '.summary_cache.json')
              if not os.path.exists(cache_path):
                  return None
              with open(cache_path) as f:
                  data = json.load(f)
              # BUGFIX: Support both 'summaries' and 'category_summaries' keys
              if 'summaries' not in data and 'category_summaries' in data:
                  data['summaries'] = data['category_summaries']
              return data

          def load_meta(release_dir):
              meta_path = os.path.join(release_dir, '.meta.json')
              if not os.path.exists(meta_path):
                  return {}
              with open(meta_path) as f:
                  return json.load(f)

          def build_category_link(cat_name, count, slug):
              """Build a markdown link for a category using slugified name."""
              cat_slug = slugify(cat_name)
              link = f'./releases/{slug}/pt_BR/{cat_slug}.md'
              return f'- [📄 {cat_name} ({count} recursos)]({link})'

          created = 0
          skipped = 0

          for rel in releases:
              slug = rel['slug']
              tag = rel['tag_name']
              name = rel['name']
              features = rel['features']
              categories_count = rel['categories']
              release_id = rel['release_id']
              date = rel['date']

              # Skip if release already exists
              if tag in existing_tags:
                  print(f'⏭️  Skip {tag}: already exists')
                  skipped += 1
                  continue

              release_dir = f'releases/{slug}'
              cache = load_cache(release_dir)
              meta = load_meta(release_dir)

              # Build executive summary (from cache or fallback)
              if cache and cache.get('executive_summary'):
                  exec_summary = cache['executive_summary']
              else:
                  exec_summary = (
                      f'A release {name} representa uma atualização significativa '
                      f'do ecossistema Salesforce com {features} novos recursos '
                      f'distribuídos em {categories_count} categorias.'
                  )

              # Build highlights from category summaries (normalized key)
              highlights = []
              if cache:
                  summaries = cache.get('summaries', {})
                  for cat_name, summary in list(summaries.items())[:5]:
                      if isinstance(summary, str) and summary.strip():
                          first_sentence = summary.split('.')[0] + '.' if '.' in summary else summary[:200]
                          highlights.append(f'- **{cat_name}**: {first_sentence}')

              # Build category links from meta.json (reliable source)
              category_links = []
              meta_cats = meta.get('categories', [])
              if meta_cats:
                  for cat in meta_cats:
                      cat_name = cat.get('name', '')
                      count = cat.get('count', 0)
                      if count > 0:
                          category_links.append(build_category_link(cat_name, count, slug))

              # Build release notes
              nl = '\n'
              notes = f'## 📦 {name}{nl}{nl}'
              notes += f'{exec_summary}{nl}{nl}'

              if highlights:
                  notes += f'### 🌟 Destaques{nl}{nl}'
                  notes += f'{nl.join(highlights)}{nl}{nl}'

              notes += f'### 📊 Estatísticas{nl}'
              notes += f'| Métrica | Valor |{nl}'
              notes += f'| --- | --- |{nl}'
              notes += f'| Recursos | **{features}** |{nl}'
              notes += f'| Categorias | **{categories_count}** |{nl}'
              if date:
                  notes += f'| Data | {date} |{nl}'
              notes += f'{nl}'

              if category_links:
                  notes += f'### 📄 Categorias{nl}{nl}'
                  notes += f'{nl.join(category_links)}{nl}{nl}'

              notes += f'### 🔗 Links{nl}'
              notes += f'- [📚 Documentação Completa](./releases/{slug}/){nl}'
              notes += f'- [📖 README](./README.md){nl}'
              notes += f'- [🌐 Documentação do Projeto](https://fatal1tybarucco.github.io/Salesforce-WebDev/){nl}{nl}'
              notes += f'### 🏷️ Módulos Trailhead{nl}'
              notes += f'Verifique os arquivos de cada categoria para módulos relacionados do Trailhead.{nl}{nl}'
              notes += f'---{nl}'
              notes += f'*Gerado automaticamente pelo Salesforce Release Notes Pipeline*'

              # Determine --latest flag
              max_existing = max(existing_ids) if existing_ids else 0
              is_latest = release_id > max_existing

              # Create the release
              cmd = ['gh', 'release', 'create', tag, '--title', name, '--notes', notes]
              if is_latest:
                  cmd.append('--latest')

              print(f'📦 Creating release: {tag} ({name})')
              result = subprocess.run(cmd, capture_output=True, text=True)
              if result.returncode == 0:
                  print(f'  ✅ Created: {tag}')
                  existing_tags.add(tag)
                  created += 1
              else:
                  print(f'  ❌ Failed: {result.stderr.strip()}')

          print(f'\n📊 Summary: {created} created, {skipped} skipped')
          PYEOF
        env:
          RELEASES_JSON: ${{ steps.release_info.outputs.releases_json }}
          EXISTING_DATA: ${{ steps.get_existing_releases.outputs.existing_data }}
