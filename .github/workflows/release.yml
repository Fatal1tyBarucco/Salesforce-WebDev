name: "Release"

on:
  workflow_run:
    workflows: ["🚀 Salesforce Release Notes Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get latest release info
        id: release_info
        run: |
          LATEST_META=$(ls -t releases/*/.meta.json 2>/dev/null | head -1)
          if [ -z "$LATEST_META" ]; then
            echo "has_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SLUG=$(basename $(dirname $LATEST_META))
          NAME=$(python3 -c "import json; print(json.load(open('$LATEST_META'))['name'])")
          FEATURES=$(python3 -c "import json; d=json.load(open('$LATEST_META')); print(d.get('total_features', sum(c['count'] for c in d.get('categories', []))))")
          DATE=$(python3 -c "import json; print(json.load(open('$LATEST_META')).get('generated_at', ''))")
          CATEGORY_COUNT=$(python3 -c "import json; print(len(json.load(open('$LATEST_META')).get('categories', [])))")
          RELEASE_ID=$(python3 -c "import json; print(json.load(open('$LATEST_META')).get('release_id', 0))")

          # Build tag in vYEAR-season format (matching pipeline)
          YEAR_SHORT=$(echo "$SLUG" | grep -oP '\d+$')
          YEAR="20${YEAR_SHORT}"
          SEASON=$(echo "$SLUG" | sed 's/_[0-9]*$//')
          TAG_NAME="v${YEAR}-${SEASON}"

          echo "has_release=true" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "features=$FEATURES" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "categories=$CATEGORY_COUNT" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check for existing release
        if: steps.release_info.outputs.has_release == 'true'
        id: check_existing
        run: |
          TAG="${{ steps.release_info.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing GitHub Release
        if: steps.release_info.outputs.has_release == 'true' && steps.check_existing.outputs.exists == 'false'
        id: gh_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.tag_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "gh_exists=true" >> $GITHUB_OUTPUT
          else
            echo "gh_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get all existing releases and their IDs
        if: steps.release_info.outputs.has_release == 'true' && steps.check_existing.outputs.exists == 'false' && steps.gh_check.outputs.gh_exists == 'false'
        id: get_existing_releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all releases and extract their release_ids
          EXISTING_RELEASES=$(gh release list --json tagName,body 2>/dev/null)
          echo "existing_releases=$EXISTING_RELEASES" >> $GITHUB_OUTPUT

          # Extract all release_ids from existing releases
          EXISTING_IDS=$(echo "$EXISTING_RELEASES" | python3 -c "
          import json, sys, re
          releases = json.load(sys.stdin)
          ids = []
          for release in releases:
              body = release.get('body', '')
              match = re.search(r'release_id.*?(\d+)', body)
              if match:
                  ids.append(int(match.group(1)))
          print(' '.join(map(str, ids)) if ids else '0')
          ")
          echo "existing_ids=$EXISTING_IDS" >> $GITHUB_OUTPUT

      - name: Generate professional release notes
        if: steps.release_info.outputs.has_release == 'true' && steps.check_existing.outputs.exists == 'false' && steps.gh_check.outputs.gh_exists == 'false'
        id: generate_notes
        run: |
          SLUG="${{ steps.release_info.outputs.slug }}"
          RELEASE_DIR="releases/${SLUG}"
          
          # Check if summary_cache.json exists for AI-generated summaries
          SUMMARY_CACHE="${RELEASE_DIR}/.summary_cache.json"
          META_FILE="${RELEASE_DIR}/.meta.json"
          
          if [ -f "$SUMMARY_CACHE" ]; then
            # Use AI-generated summaries
            EXECUTIVE_SUMMARY=$(python3 -c "
            import json
            with open('$SUMMARY_CACHE', 'r') as f:
                data = json.load(f)
            print(data.get('executive_summary', ''))
            ")
            
            # Generate category links and highlights
            CATEGORY_NOTES=$(python3 -c "
            import json, os
            with open('$SUMMARY_CACHE', 'r') as f:
                data = json.load(f)
            
            summaries = data.get('summaries', {})
            categories = []
            for category_file, summary in summaries.items():
                # Extract category name from file name (e.g., documentacao_legal.md -> Documentação Legal)
                category_name = category_file.replace('_', ' ').title()
                # Extract count from meta.json
                count = 0
                try:
                    with open('$META_FILE', 'r') as mf:
                        meta = json.load(mf)
                        for cat in meta.get('categories', []):
                            if cat.get('name').lower().replace(' ', '_') == category_file:
                                count = cat.get('count', 0)
                                break
                except:
                    pass
                # Create markdown link with count
                link = f'- [📄 {category_name} ({count} recursos)](./releases/{os.path.basename(\"$RELEASE_DIR\")}/pt_BR/{category_file}.md)'
                categories.append(link)
            
            print('\\n'.join(categories))
            ")
            
            # Generate highlights from summaries
            HIGHLIGHTS=$(python3 -c "
            import json
            with open('$SUMMARY_CACHE', 'r') as f:
                data = json.load(f)
            
            summaries = data.get('summaries', {})
            highlights = []
            for category_file, summary in summaries.items():
                # Extract first sentence as highlight
                highlight = summary.split('.')[0] + '.' if '.' in summary else summary
                highlights.append(f'- **{category_file.replace(\"_\", \" \").title()}**: {highlight}')
            
            print('\\n'.join(highlights[:5]))  # Top 5 highlights
            ")
          else
            # Fallback to basic summary
            EXECUTIVE_SUMMARY="Release ${SLUG} traz ${FEATURES} novos recursos distribuídos em ${CATEGORY_COUNT} categorias."
            CATEGORY_NOTES=""
            HIGHLIGHTS=""
          fi
          
          # Escape newlines for GitHub Actions
          EXECUTIVE_SUMMARY_ESCAPED=$(echo "$EXECUTIVE_SUMMARY" | sed ':a;N;$!ba;s/\n/\\n/g')
          CATEGORY_NOTES_ESCAPED=$(echo "$CATEGORY_NOTES" | sed ':a;N;$!ba;s/\n/\\n/g')
          HIGHLIGHTS_ESCAPED=$(echo "$HIGHLIGHTS" | sed ':a;N;$!ba;s/\n/\\n/g')
          
          echo "executive_summary=$EXECUTIVE_SUMMARY_ESCAPED" >> $GITHUB_OUTPUT
          echo "category_notes=$CATEGORY_NOTES_ESCAPED" >> $GITHUB_OUTPUT
          echo "highlights=$HIGHLIGHTS_ESCAPED" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: |
          steps.release_info.outputs.has_release == 'true' &&
          steps.check_existing.outputs.exists == 'false' &&
          steps.gh_check.outputs.gh_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.tag_name }}"
          NAME="${{ steps.release_info.outputs.name }}"
          FEATURES="${{ steps.release_info.outputs.features }}"
          CATEGORIES="${{ steps.release_info.outputs.categories }}"
          DATE="${{ steps.release_info.outputs.date }}"
          SLUG="${{ steps.release_info.outputs.slug }}"
          RELEASE_ID="${{ steps.release_info.outputs.release_id }}"
          EXISTING_IDS="${{ steps.get_existing_releases.outputs.existing_ids }}"
          EXECUTIVE_SUMMARY="${{ steps.generate_notes.outputs.executive_summary }}"
          CATEGORY_NOTES="${{ steps.generate_notes.outputs.category_notes }}"
          HIGHLIGHTS="${{ steps.generate_notes.outputs.highlights }}"

          NL=$'\n'
          NOTES="## 📦 ${NAME}${NL}${NL}"
          NOTES+="${EXECUTIVE_SUMMARY}${NL}${NL}"
          
          # Add highlights if available
          if [ -n "$HIGHLIGHTS" ]; then
            NOTES+="### 🌟 Destaques${NL}${NL}"
            NOTES+="${HIGHLIGHTS}${NL}${NL}"
          fi
          
          NOTES+="### 📊 Estatísticas${NL}"
          NOTES+="| Métrica | Valor |${NL}"
          NOTES+="| --- | --- |${NL}"
          NOTES+="| Recursos | **${FEATURES}** |${NL}"
          NOTES+="| Categorias | **${CATEGORIES}** |${NL}"
          NOTES+="| Data | ${DATE} |${NL}${NL}"
          
          # Add category links if available
          if [ -n "$CATEGORY_NOTES" ]; then
            NOTES+="### 📄 Categorias${NL}${NL}"
            NOTES+="${CATEGORY_NOTES}${NL}${NL}"
          fi
          
          NOTES+="### 🔗 Links${NL}"
          NOTES+="- [📚 Documentação Completa](./releases/${SLUG}/)${NL}"
          NOTES+="- [📖 README](./README.md)${NL}"
          NOTES+="- [🌐 Documentação do Projeto](https://fatal1tybarucco.github.io/Salesforce-WebDev/)${NL}${NL}"
          NOTES+="### 🏷️ Módulos Trailhead${NL}"
          NOTES+="Verifique os arquivos de cada categoria para módulos relacionados do Trailhead.${NL}${NL}"
          NOTES+="---"
          NOTES+="*Gerado automaticamente pelo Salesforce Release Notes Pipeline*"

          # Determine --latest flag based on release_id
          MAX_EXISTING=$(echo "$EXISTING_IDS" | tr ' ' '\n' | sort -n | tail -1 || echo "0")
          if [ -z "$MAX_EXISTING" ] || [ "$RELEASE_ID" -gt "$MAX_EXISTING" ]; then
            IS_LATEST="--latest"
          else
            IS_LATEST=""
          fi

          gh release create "$TAG" \
            --title "$NAME" \
            --notes "$NOTES" \
            $IS_LATEST

      - name: Update release badge
        if: |
          steps.release_info.outputs.has_release == 'true' &&
          steps.check_existing.outputs.exists == 'false' &&
          steps.gh_check.outputs.gh_exists == 'false'
        run: |
          TAG="${{ steps.release_info.outputs.tag_name }}"
          echo "Release created: $TAG"
