name: Deploy MkDocs to GitHub Pages

run-name: "📚 Deploy Docs — ${{ github.ref_name }} — ${{ github.sha }} — @${{ github.actor }}"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "!src/**/__init__.py"
      - "releases/**"
      - "README.md"
      - "README.en.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write   # mike push do ledger de versões (branch gh-pages)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: 🏗️ Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: 🐍 Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: 📦 Install dependencies
        run: uv sync --frozen --extra docs --extra imaging

      - name: 📦 Install package in editable mode
        run: uv pip install -e .

      # GATE DURO DE CONTRATO (ADR-012): o site só publica se manifest,
      # nav, docs/ e a árvore real do repositório estiverem em sincronia.
      # Reconciliação determinística ANTES do gate: sync e build disparam
      # no mesmo push; se o sync corrigiu o baseline e commitou com
      # skip-ci (anti-cascata), o build deste mesmo push ainda enxerga o
      # estado pré-correção. O reconcile é idempotente e LLM-free —
      # reproduz exatamente as correções estruturais do sync, sem
      # suavizar o gate: divergências de prose (OMITO/OBSOLETO/DIVERGENTE
      # não auto-corrigíveis) continuam falhando o build.
      - name: 🔄 Reconciliação determinística (pré-gate, idempotente)
        run: |
          echo "::group::🔄 Deterministic Reconciliation (pre-gate)"
          python3 .github/scripts/docs_sync_engine.py reconcile
          echo "::endgroup::"

      - name: 🧾 Validar contrato de documentação (hard gate)
        run: |
          echo "::group::🧾 Documentation Contract (ADR-012)"
          python3 .github/scripts/docs_contract.py validate
          echo "::endgroup::"

      - name: 🏗️ Build documentation
        run: |
          echo "::group::🏗️ Building MkDocs Site"
          # --no-sync: preserva o extra imaging instalado no step anterior
          # (social cards exigem pillow/cairosvg; uv run implícito os removeria).
          uv run --no-sync mkdocs build --strict
          echo "::endgroup::"

      # Versionamento com mike (ADR-012): cada release/tag gera uma versão
      # permanente do site; `latest` acompanha main. O branch gh-pages é o
      # ledger de versões do mike; o deploy oficial continua via
      # upload-pages-artifact + deploy-pages (o conteúdo do ledger é
      # materializado em site/ antes do upload).
      - name: 🏷️ Resolve documentation version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📚 Documentation version: $VERSION"

      - name: 📚 Deploy versioned docs with mike
        env:
          DOC_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::group::📚 mike versioned deploy"
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv run --no-sync mike deploy --update-aliases "$DOC_VERSION" latest --branch gh-pages --push
          git fetch origin gh-pages
          # set-default apenas quando o ledger ainda não tem raiz (primeira
          # execução) — evita commits vazios em execuções subsequentes.
          if ! git show FETCH_HEAD:index.html > /dev/null 2>&1; then
            uv run --no-sync mike set-default latest --branch gh-pages --push
            git fetch origin gh-pages
          fi
          rm -rf site
          mkdir -p site
          git archive FETCH_HEAD | tar -x -C site
          echo "::endgroup::"

      - name: 📋 Write doc-update summary (step summary + artifact)
        run: |
          {
            echo "## 📚 Documentação Atualizada — Resumo do Deploy"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| **Commit** | \`$(git log -1 --format='%h')\` — $(git log -1 --format='%s') |"
            echo "| **Autor** | $(git log -1 --format='%an') |"
            echo "| **Data** | $(git log -1 --format='%ci' | cut -d' ' -f1) |"
            echo "| **Site** | [fatal1tybarucco.github.io/Salesforce-WebDev/](https://fatal1tybarucco.github.io/Salesforce-WebDev/) |"
            echo ""
            echo "### Arquivos de documentação alterados (desde HEAD~1)"
            echo ""
            if git diff --name-only HEAD~1 -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md 2>/dev/null | grep -q .; then
              echo '```'
              git diff --name-only HEAD~1 -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md
              echo '```'
            else
              echo "_Nenhum arquivo de documentação alterado no último commit_"
            fi
            echo ""
            echo "### Estatísticas"
            echo ""
            echo "- Arquivos rastreados em docs/: **$(git ls-files docs/ mkdocs.yml README.md README.en.md CHANGELOG.md | wc -l)**"
            echo "- Pipeline: **MkDocs** (Material theme, strict mode)"
            echo "- Deployment: **GitHub Pages**"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "# 📚 Documentação Atualizada — Resumo do Deploy MkDocs"
            echo ""
            echo "**Status do Workflow:** ✅ Completo"
            echo "**Repositório:** Fatal1tyBarucco/Salesforce-WebDev"
            echo "**Commit:** $(git log -1 --format='%h | %s')"
            echo "**Autor:** $(git log -1 --format='%an')"
            echo ""
            echo "---"
            echo ""
            echo "## Arquivos alterados (desde HEAD~1)"
            echo ""
            if git diff --name-only HEAD~1 -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md 2>/dev/null | grep -q .; then
              git diff --name-only HEAD~1 -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md | sed 's/^/* /'
            else
              echo "* Nenhum arquivo de documentação alterado no último commit"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Estatísticas"
            echo ""
            echo "| Métrica | Valor |"
            echo "|---------|-------|"
            echo "| Arquivos rastreados | $(git ls-files docs/ mkdocs.yml README.md README.en.md CHANGELOG.md | wc -l) |"
            echo "| Pipeline | MkDocs (Material) |"
            echo "| Modo | strict |"
            echo "| Deploy target | GitHub Pages |"
          } > docs-updates-formatted.md

      - name: 📦 Upload doc-update summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-updates-summary
          path: docs-updates-formatted.md
          retention-days: 7
          overwrite: true

      - name: 📦 Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

      - name: 📋 Build Summary
        if: always()
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| MkDocs Build | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Site deployed to GitHub Pages." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: 📋 Deploy Summary
        if: always()
        run: |
          echo "## 🚀 Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployment completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | github-pages |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deployment.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
