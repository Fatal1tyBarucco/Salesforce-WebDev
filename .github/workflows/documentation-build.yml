name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "!src/**/__init__.py"
      - "releases/**"
      - "README.md"
      - "README.en.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --extra docs

      - name: Build documentation
        run: |
          uv run mkdocs build --strict

      - name: Show documentation updates (summary for deploy)
        run: |
          echo "=== DOCS UPDATED ==="
          git diff --name-only HEAD~1 -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md || echo "(first deploy or no doc changes in last commit)"
          echo "=== DOCS FILES CURRENT ==="
          git ls-files docs/ mkdocs.yml README.md README.en.md CHANGELOG.md | wc -l | xargs echo "tracked docs files:"
          git log -1 --format="commit: %h | msg: %s" -- docs/ mkdocs.yml README.md README.en.md CHANGELOG.md || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
