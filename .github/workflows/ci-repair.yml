# CI Repair — Auto-fix failed Python Quality

name: CI Repair

on:
  workflow_run:
    workflows: ["Python Quality"]
    types: [completed]
    branches-ignore: [main]

permissions:
  contents: read
  pull_requests: write
  issues: write

concurrency:
  group: ci-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: /tmp/uv-cache
  MAX_REPAIR_ATTEMPTS: 2

jobs:
  diagnose:
    name: Diagnose Failures
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    outputs:
      should-repair: ${{ steps.decide.outputs.should-repair }}
      repair-branch: ${{ steps.decide.outputs.repair-branch }}
      pr-number: ${{ steps.decide.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --head ${{ github.event.workflow_run.head_branch }} --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Get failed job logs
        id: logs
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          gh run view $RUN_ID --log-failed > /tmp/failed_logs.txt 2>&1 || true

      - name: Decide repair
        id: decide
        run: |
          FAILED_JOBS=$(cat /tmp/failed_logs.txt | grep -E "(ruff|format|mypy|tests)" | head -20 || true)
          
          if [ -z "$FAILED_JOBS" ]; then
            echo "should-repair=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          REPAIR_BRANCH="ci-repair/${{ github.event.workflow_run.head_branch }}"
          ATTEMPTS=$(git log --oneline --grep="ci-repair" --grep="$REPAIR_BRANCH" --all | wc -l || echo 0)
          
          if [ "$ATTEMPTS" -ge "${{ env.MAX_REPAIR_ATTEMPTS }}" ]; then
            echo "should-repair=false" >> $GITHUB_OUTPUT
            gh issue create               --title "CI Repair: Max attempts exceeded"               --body "CI Repair tried $ATTEMPTS times and failed. Manual intervention needed.
Branch: ${{ github.event.workflow_run.head_branch }}
PR: #${{ steps.pr.outputs.pr-number }}"               --label "ci-repair,blocked,needs-human" || true
            exit 0
          fi
          
          echo "should-repair=true" >> $GITHUB_OUTPUT
          echo "repair-branch=$REPAIR_BRANCH" >> $GITHUB_OUTPUT

  repair:
    name: Auto Repair
    needs: diagnose
    runs-on: ubuntu-latest
    if: needs.diagnose.outputs.should-repair == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Apply fixes
        id: fixes
        run: |
          FIXES_APPLIED=""
          
          uv run ruff check . --fix && FIXES_APPLIED="$FIXES_APPLIED ruff-fix" || true
          uv run ruff format . && FIXES_APPLIED="$FIXES_APPLIED ruff-format" || true
          
          # Mypy and tests: capture errors for analysis (no auto-fix)
          uv run mypy src/ --ignore-missing-imports > /tmp/mypy_errors.txt 2>&1 || true
          uv pip install "syrupy>=4.9.0,<5" 2>/dev/null || true
          uv run pytest tests/ -x -q --tb=short > /tmp/test_errors.txt 2>&1 || true
          
          echo "fixes-applied=$FIXES_APPLIED" >> $GITHUB_OUTPUT

      - name: Create repair branch and PR
        if: steps.fixes.outputs.fixes-applied != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPAIR_BRANCH="${{ needs.diagnose.outputs.repair-branch }}"
          PR_NUMBER="${{ needs.diagnose.outputs.pr-number }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes after auto-fix."
            exit 0
          fi
          
          git add -A
          git commit -m "ci-repair: auto-fix ruff/format failures"
          git push origin HEAD:$REPAIR_BRANCH --force-with-lease
          
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment $PR_NUMBER --body "CI Repair applied fixes. CI will re-run automatically." || true
          else
            gh pr create               --title "ci-repair: auto-fix for ${{ github.event.workflow_run.head_branch }}"               --body "Auto-fixes applied by CI Repair."               --base ${{ github.event.workflow_run.head_branch }}               --head $REPAIR_BRANCH               --label "ci-repair,auto-fix" || true
          fi

  summary:
    name: CI Repair Summary
    runs-on: ubuntu-latest
    needs: [diagnose, repair]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## CI Repair" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.diagnose.outputs.should-repair }}" = "true" ]; then
            echo "Repair attempted. Check PR for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No repair needed or escalated to human." >> $GITHUB_STEP_SUMMARY
          fi
