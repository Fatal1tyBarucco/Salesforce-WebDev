# AI Triage — Issues & PRs Automated Labeling

name: AI Triage

run-name: "🏷️ AI Triage — #${{ github.event.issue.number || github.event.pull_request.number }} — ${{ github.event_name }} — @${{ github.actor }}"

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

concurrency:
  group: ai-triage-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: 🏷️ AI Triage
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Analyze, label, and triage
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import re
          import subprocess
          import sys

          GH_TOKEN = os.environ['GH_TOKEN']
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')

          with open(os.environ['GITHUB_EVENT_PATH']) as f:
            event = json.load(f)

          if event_name == 'issues' or 'issue' in event:
            number = event['issue']['number']
            title = event['issue']['title'] or ''
            body = event['issue']['body'] or ''
            type_ = 'issue'
          else:
            number = event['pull_request']['number']
            title = event['pull_request']['title'] or ''
            body = event['pull_request']['body'] or ''
            type_ = 'pr'

          text = f"{title} {body}"
          text_lower = text.lower()

          labels = []
          patterns = [
            ("scraper|playwright|chromium|browser", "scraper"),
            ("parser|beautifulsoup|html|toc|feature\\.impact", "parser"),
            ("llm|openai|gemini|openrouter|anthropic|model|prompt", "llm"),
            ("pipeline|orchestrator|etl|release\\.notes", "pipeline"),
            ("doc|readme|mkdocs|documentation", "docs"),
            ("infra|docker|k8s|kubernetes|deploy|ci|cd|github\\.action", "infra"),
            ("ai|agent|skill|command|mcp|claude", "ai"),
            ("test|coverage|pytest|snapshot|golden", "test"),
            ("security|secret|vulnerab|gitleaks|pip\\.audit", "security"),
            ("performance|slow|latency|benchmark|profile", "performance"),
            ("bug|error|fail|crash|exception|traceback", "bug"),
            ("feature|enhancement|new|add|implement", "feature"),
            ("refactor|clean\\.arch|clean\\.architecture|solid|decouple", "refactor"),
            ("chore|deps|dependabot|upgrade|bump|lockfile", "chore"),
          ]
          for pattern, label in patterns:
            if re.search(pattern, text_lower):
              labels.append(label)

          priority = "P3"
          priority_keywords = {
            "P0": "security|secret|pipeline\\.broken|release\\.blocked|data\\.loss",
            "P1": "ci\\.failing|coverage\\.drop|regression|blocker",
            "P2": "feature|enhancement|refactor|improvement",
            "P3": "docs|cleanup|chore|nitpick",
          }
          for p, keywords in priority_keywords.items():
            if re.search(keywords, text_lower):
              priority = p
              break
          labels.append(f"priority:{priority}")

          components = {
            "scraper": "scraper|playwright|chromium",
            "parser": "parser|beautifulsoup|toc|feature",
            "llm": "llm|openai|gemini|openrouter|anthropic",
            "pipeline": "pipeline|orchestrator|etl",
            "docs": "doc|readme|mkdocs",
            "infra": "infra|docker|k8s|ci|cd",
            "ai": "ai|agent|skill|command|mcp",
            "test": "test|coverage|pytest",
          }
          for comp, kw in components.items():
            if re.search(kw, text_lower):
              labels.append(f"component:{comp}")

          if type_ == 'pr':
            labels.append("type:pr")
            try:
              result = subprocess.run(
                ['gh', 'pr', 'view', str(number), '--json', 'files', '--jq', '.files | length'],
                capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
              )
              changed_files = int(result.stdout.strip() or 0)
            except Exception:
              changed_files = 0
            if changed_files <= 3:
              size = "size:XS"
            elif changed_files <= 10:
              size = "size:S"
            elif changed_files <= 30:
              size = "size:M"
            elif changed_files <= 100:
              size = "size:L"
            else:
              size = "size:XL"
            labels.append(size)
          else:
            labels.append("type:issue")

          for label in labels:
            subprocess.run(
              ['gh', type_, 'edit', str(number), '--add-label', label],
              capture_output=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )

          keywords = re.sub(r'[^a-z0-9 ]', '', title.lower()).replace(' ', '|')
          if type_ == 'issue':
            result = subprocess.run(
              ['gh', 'issue', 'list', '--state', 'all', '--search', f'{keywords} in:title', '--json', 'number,title,state', '--jq', '.[] | select(.number != %d) | "\\(.number): \\(.title) [\\(.state)]"' % number],
              capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )
          else:
            result = subprocess.run(
              ['gh', 'pr', 'list', '--state', 'all', '--search', f'{keywords} in:title', '--json', 'number,title,state', '--jq', '.[] | select(.number != %d) | "\\(.number): \\(.title) [\\(.state)]"' % number],
              capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )
          similar = result.stdout.strip()[:500] if result.stdout.strip() else ''
          has_duplicates = bool(similar)

          if has_duplicates:
            subprocess.run(
              ['gh', type_, 'comment', str(number), '--body', 'Possible duplicates found. Please verify before proceeding.'],
              capture_output=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )

          missing = []
          if type_ == 'issue':
            if re.search(r'bug|error|fail|crash', title, re.I):
              if not re.search(r'steps to reproduce|passos para reproduzir|reproduz', body, re.I):
                missing.append("- [ ] Steps to reproduce")
              if not re.search(r'expected|esperado', body, re.I):
                missing.append("- [ ] Expected behavior")
              if not re.search(r'actual|atual|observado', body, re.I):
                missing.append("- [ ] Actual behavior")
              if not re.search(r'logs|log|traceback|stack', body, re.I):
                missing.append("- [ ] Logs/Traceback")
            if re.search(r'feature|enhancement|new', title, re.I):
              if not re.search(r'user story|historia|acceptance|critério', body, re.I):
                missing.append("- [ ] User story / Acceptance criteria")
          else:
            if not re.search(r'related|fixes|closes|issue', body, re.I):
              missing.append("- [ ] Related issue (e.g., Fixes #123)")
            if not re.search(r'test|tested|coverage', body, re.I):
              missing.append("- [ ] Test evidence")

          has_missing = bool(missing)
          if has_missing:
            missing_info = "\n".join(missing)
            subprocess.run(
              ['gh', type_, 'comment', str(number), '--body', f'Missing information detected. Please add the suggested items.\n{missing_info}'],
              capture_output=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )

          status_map = {"P0": "3808f0ce", "P1": "3808f0ce", "P2": "a368d611", "P3": "a368d611"}
          status = status_map.get(priority, "a368d611")

          result = subprocess.run(
            ['gh', type_, 'view', str(number), '--json', 'id', '-q', '.id'],
            capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
          )
          issue_id = result.stdout.strip()
          if issue_id:
            subprocess.run(
              ['gh', 'api', 'graphql', '-f', f'query=mutation {{ addProjectV2ItemById(input: {{ projectId: "PVT_kwDOCQOIIc4BiKNM" contentId: "{issue_id}" }}) {{ item {{ id }} }} }}'],
              capture_output=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )

            result = subprocess.run(
              ['gh', 'api', 'graphql', '-f', f'query=query {{ node(id: "{issue_id}") {{ ... on Issue {{ projectItems(first: 1) {{ nodes {{ id }} }} }} ... on PullRequest {{ projectItems(first: 1) {{ nodes {{ id }} }} }} }} }}', '--jq', '.data.node.projectItems.nodes[0].id // empty'],
              capture_output=True, text=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
            )
            item_id = result.stdout.strip()
            if item_id:
              subprocess.run(
                ['gh', 'api', 'graphql', '-f', f'query=mutation {{ updateProjectV2ItemFieldValue(input: {{ projectId: "PVT_kwDOCQOIIc4BiKNM" itemId: "{item_id}" fieldId: "PVTSSF_lADOCQOIIc4BiKNMzhhDPfg" value: {{ singleSelectOptionId: "{status}" }} }}) {{ projectV2Item {{ id }} }} }}'],
                capture_output=True, env={**os.environ, 'GH_TOKEN': GH_TOKEN}
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"labels={' '.join(labels)}\n")
            f.write(f"priority={priority}\n")
            f.write(f"number={number}\n")
            f.write(f"type={type_}\n")
            f.write(f"has-duplicates={'true' if has_duplicates else 'false'}\n")
            f.write(f"has-missing={'true' if has_missing else 'false'}\n")
          PYEOF

      - name: 💬 Comment duplicates
        if: steps.analyze.outputs.has-duplicates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER="${{ steps.analyze.outputs.number }}"
          TYPE="${{ steps.analyze.outputs.type }}"
          gh "$TYPE" comment "$NUMBER" --body "Possible duplicates found. Please verify before proceeding." || true

      - name: 💬 Comment missing info
        if: steps.analyze.outputs.has-missing == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER="${{ steps.analyze.outputs.number }}"
          TYPE="${{ steps.analyze.outputs.type }}"
          gh "$TYPE" comment "$NUMBER" --body "Missing information detected. Please add the suggested items." || true

      - name: 📋 Triage Summary
        if: always()
        run: |
          echo "## 🏷️ AI Triage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | \`${{ steps.analyze.outputs.type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Labels Applied | \`${{ steps.analyze.outputs.labels }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Priority | \`${{ steps.analyze.outputs.priority }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Duplicates | ${{ steps.analyze.outputs.has-duplicates == 'true' && '🔴 Found' || '🟢 None' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Missing Info | ${{ steps.analyze.outputs.has-missing == 'true' && '🟡 Flagged' || '🟢 Complete' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.analyze.outputs.has-duplicates }}" = "true" ]; then
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> Possible duplicates detected — review required" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.analyze.outputs.has-missing }}" = "true" ]; then
            echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
            echo "> Missing information flagged — comment added" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    name: 📋 Triage Summary
    runs-on: ubuntu-latest
    needs: triage
    if: always()
    steps:
      - name: 📋 Write summary
        run: |
          echo "## 📋 AI Triage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Labels: applied" >> $GITHUB_STEP_SUMMARY
          echo "Duplicates: ${{ needs.triage.outputs.has-duplicates == 'true' && 'found' || 'none' }}" >> $GITHUB_STEP_SUMMARY
          echo "Missing info: ${{ needs.triage.outputs.has-missing == 'true' && 'flagged' || 'complete' }}" >> $GITHUB_STEP_SUMMARY
          echo "Project: updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```mermaid' >> $GITHUB_STEP_SUMMARY
          echo 'flowchart LR' >> $GITHUB_STEP_SUMMARY
          echo '    A[Issue/PR Event] --> B[🏷️ Analyze & Label]' >> $GITHUB_STEP_SUMMARY
          echo '    B --> C[🔍 Check Duplicates]' >> $GITHUB_STEP_SUMMARY
          echo '    B --> D[❓ Check Missing Info]' >> $GITHUB_STEP_SUMMARY
          echo '    B --> E[📊 Update Project]' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
