name: AI Documentation Pipeline (OpenRouter Free)

on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'src/**'
      - 'force-app/**'
      - 'sfdx-project.json'
  workflow_dispatch:
    inputs:
      since_ref:
        description: 'Git ref to start from (optional)'
        required: false
        type: string
        default: ''
      publish_mode:
        description: 'How to publish generated documentation'
        required: true
        type: choice
        options: [commit, pr]
        default: pr
  workflow_call:
    inputs:
      since_ref:
        description: 'Git ref to start from (optional)'
        required: false
        type: string
        default: ''
      publish_mode:
        description: 'How to publish generated documentation'
        required: false
        type: string
        default: commit
    secrets:
      OPENROUTER_API_KEY:
        required: true

concurrency:
  group: ai-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      head_branch: ${{ steps.publish.outputs.head_branch }}
      has_changes: ${{ steps.publish.outputs.has_changes }}
    env:
      AI_DOCS_MODEL: ${{ vars.AI_DOCS_MODEL || 'openrouter/free' }}
      AI_DOCS_SELF_REVIEW: ${{ vars.AI_DOCS_SELF_REVIEW || 'false' }}
      AI_DOCS_MAX_CONTEXT_TOKENS: ${{ vars.AI_DOCS_MAX_CONTEXT_TOKENS || '12000' }}
      PUBLISH_MODE: ${{ inputs.publish_mode || 'commit' }}
      AI_DOCS_REVIEWERS: ${{ vars.AI_DOCS_REVIEWERS || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install project dependencies
        run: |
          pip install uv
          uv sync --frozen --extra dev --group dev

      - name: Resolve incremental base ref
        id: since
        env:
          INPUT_SINCE_REF: ${{ inputs.since_ref }}
        run: |
          if [ -n "$INPUT_SINCE_REF" ]; then
            echo "ref=$INPUT_SINCE_REF" >> "$GITHUB_OUTPUT"
          elif [ -f docs/.last-processed-ref ]; then
            echo "ref=$(cat docs/.last-processed-ref)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~10" >> "$GITHUB_OUTPUT"
          fi

      - name: Run documentation generation
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINCE_REF: ${{ steps.since.outputs.ref }}
        run: uv run python -m src.ai.orchestrator --since-ref "$SINCE_REF" --publish-mode "$PUBLISH_MODE"

      - name: Upload AI audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-docs-audit-${{ github.run_id }}
          path: docs/.ai-logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Commit or push review branch
        id: publish
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name "AI-Docs Bot"
          git config user.email "ai-docs-bot@users.noreply.github.com"
          git add CHANGELOG.md docs/ai-generated/ docs/.last-processed-ref
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated documentation changes; no commit created."
            exit 0
          fi
          git commit -m "docs: atualização automática via IA [skip ci]"
          if [ "$PUBLISH_MODE" = "pr" ]; then
            branch="ai-docs/${GITHUB_RUN_ID}"
            git push origin "HEAD:$branch"
            echo "head_branch=$branch" >> "$GITHUB_OUTPUT"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  open-review-pr:
    needs: generate
    if: needs.generate.result == 'success' && needs.generate.outputs.has_changes == 'true' && inputs.publish_mode == 'pr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_DOCS_REVIEWERS: ${{ vars.AI_DOCS_REVIEWERS || '' }}
      HEAD_BRANCH: ${{ needs.generate.outputs.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.generate.outputs.head_branch }}
          fetch-depth: 1

      - name: Open review PR
        run: |
          gh pr create \
            --title "docs: atualização automática via IA [skip ci]" \
            --body-file docs/ai-generated/leadership.md \
            --base "${GITHUB_REF_NAME}" \
            --head "$HEAD_BRANCH"
          if [ -n "$AI_DOCS_REVIEWERS" ]; then
            IFS=',' read -ra reviewers <<< "$AI_DOCS_REVIEWERS"
            for reviewer in "${reviewers[@]}"; do
              reviewer="$(echo "$reviewer" | xargs)"
              [ -z "$reviewer" ] || gh pr edit "$HEAD_BRANCH" --add-reviewer "$reviewer"
            done
          fi
