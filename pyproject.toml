[project]
name = "salesforce-release-notes"
version = "3.1.0"
description = "Pipeline ETL para extração, classificação e versionamento das Salesforce Release Notes"
requires-python = ">=3.13,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.0,<5",
    "lxml[html_clean]>=5.0.0,<7",
    "playwright>=1.40.0,<2",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "tenacity>=8.0.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
# openai is kept as a core dep because OpenCode and OpenRouter use
# the OpenAI-compatible client. google-genai is the primary provider.
healing = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "PyGithub>=2.6.0,<3",
    "langchain>=1.3.9,<2",
    "langchain-google-genai>=2.0.0,<5",
    "httpx>=0.28.0,<1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.5.0,<10",
    "mkdocstrings[python]>=0.27.0,<2",
    "black>=24.0.0,<27",
]
observability = [
    "prometheus-client>=0.20.0,<1",
]
dev = [
    "black>=24.0.0,<27",
    "ruff>=0.5.0,<1",
    "pytest>=8.0.0,<10",
    "pytest-xdist>=3.5.0,<4",
    "pytest-cov>=5.0.0,<8",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0,<3",
    "freezegun>=1.4.0",
    "types-requests>=2.31.0,<3",
    "types-beautifulsoup4>=4.12.0,<5",
    "pre-commit>=3.5.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["F401", "F821", "E741"]
ignore = [
    "BLE001",   # blind exception catching — intentional in error handlers
    "S110",      # try-except-pass — intentional suppression
    "S112",      # try-except-continue — intentional suppression
    "SIM102",    # nested if — readability preference
    "SIM117",    # nested with — readability preference
    "PLW1510",   # subprocess.run without check — handled by caller
    "RUF034",    # useless if-else — type-checking workaround
    "B017",      # pytest.raises(Exception) — broad match intentional
]

[tool.mypy]
strict = true
mypy_path = "stubs"
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short --durations=10 --timeout=120"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:bs4.*",
]

[tool.coverage.run]
omit = [
    "src/auto_healing/*",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
