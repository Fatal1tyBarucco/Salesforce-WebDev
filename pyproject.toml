[project]
name = "salesforce-release-notes"
version = "0.4.1"
description = "Pipeline ETL para extração, classificação e versionamento das Salesforce Release Notes — Knowledge-as-Code com IA para Salesforce Release Notes Intelligence"
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4>=4.12.0,<5",
    "lxml[html_clean]>=6.1.1,<7",
    "playwright>=1.61.0,<2",
    "openai>=1.50.0,<3",
    "google-genai>=1.0.0,<3",
    "tenacity>=8.0.0,<9",
    "aiohttp>=3.14.4,<4",
    "pydantic>=2.13.4,<3",
    "prometheus-client>=0.26.0,<1",
    "structlog>=24.0.0,<25",
    "mcp==1.30.0",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
# openai is kept as a core dep because OpenCode and OpenRouter use
# the OpenAI-compatible client. google-genai is the primary provider.
healing = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.52.0,<1",
    "PyGithub>=2.10.0,<3",
    "langchain>=1.5.0,<2",
    "langchain-google-genai>=2.0.0,<3",
    "httpx>=0.28.0,<1",
    "strawberry-graphql[fastapi]>=0.341.2,<1",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.1,<10",
    "mkdocstrings[python]>=1.0.8,<2",
    "mkdocs-minify-plugin>=0.5,<1",
    "mkdocs-htmlproofer-plugin>=1.0,<2",
    "ruff>=0.17.5,<1",
]
observability = [
    "prometheus-client>=0.26.0,<1",
]
dev = [
    "ruff>=0.17.5,<1",
    "pytest>=9.2.0,<10",
    "pytest-xdist>=3.5.0,<4",
    "pytest-cov>=5.0.0,<8",
    "pytest-asyncio>=1.5.0,<2",
    "mypy>=2.4.1,<3",
    "freezegun>=1.4.0",
    "types-beautifulsoup4>=4.12.0,<5",
    "types-html5lib>=1.1.11.20260518",
    "types-webencodings>=0.6.0.20261104",
    "pre-commit>=4.7.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]

[tool.ruff.lint]
extend-select = ["F401", "F821", "E741"]
ignore = [
    "BLE001",   # blind exception catching — intentional in error handlers
    "S110",      # try-except-pass — intentional suppression
    "S112",      # try-except-continue — intentional suppression
    "SIM102",    # nested if — readability preference
    "SIM117",    # nested with — readability preference
    "PLW1510",   # subprocess.run without check — handled by caller
    "RUF034",    # useless if-else — type-checking workaround
    "B017",      # pytest.raises(Exception) — broad match intentional
]

[tool.mypy]
strict = true
mypy_path = "stubs"
warn_unused_ignores = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --tb=short --durations=10 --timeout=120"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:bs4.*",
]

[tool.coverage.run]
branch = true


[dependency-groups]
dev = [
    "pytest-asyncio>=1.5.0,<2",
    "pytest-timeout>=2.4.0",
    "syrupy>=7.0.2",
]

[tool.mutmut]
# ADR-011: medição de mutação focada na camada de cache.
# mutmut 2.5.0 (runner sequencial via subprocess — funciona em kernels que
# bloqueiam semáforos POSIX, ex.: Termux/Android). Instale com:
#   uv pip install "mutmut==2.5.0"
# O mutmut_config.toml legado permanece para o escopo domain/services.
paths_to_mutate = ["src/cache_manager.py"]
tests_dir = "tests/"
runner = "python -m pytest tests/test_cache_manager.py tests/test_cache_robustness.py -x -q --no-header -p no:cacheprovider"
