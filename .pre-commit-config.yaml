# Byte-exact content: golden fixtures, syrupy snapshots and versioned release
# artifacts must NEVER be whitespace-normalized — it corrupts characterization
# tests and invalidates release fingerprints (2026-11-19).
exclude: ^(tests/golden/|tests/__snapshots__/|releases/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe: mkdocs.yml usa a tag !ENV do MkDocs Material
        # (social cards habilitadas apenas em CI) — construtor custom
        # legítimo que o safe loader padrão desconhece (ADR-012).
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]

  # Local hooks use the tool versions resolved by uv from pyproject.toml/uv.lock.
  # This avoids maintaining a second independent pin here.
  - repo: local
    hooks:
      - id: uv-lock-check
        name: 🔒 Verify uv.lock is in sync with pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        files: ^src/
        args:
          - --ignore-missing-imports
          - --disallow-untyped-defs
          - --disallow-incomplete-defs
        additional_dependencies:
          - types-requests
          - types-beautifulsoup4
          - types-html5lib
          - types-webencodings

  # Local hooks — run in the project's own venv (uv)
  - repo: local
    hooks:
      - id: pytest-fast
        name: 🧪 Pytest (fast, no coverage)
        entry: bash .hooks/pytest-pre-push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-coverage
        name: 🧪 Pytest (coverage ≥95%)
        entry: python3 -m pytest tests/ --cov=src --cov-fail-under=95 -q --tb=short --no-header
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
