<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce Release Notes — Dashboard Interativo</title>
<link rel="stylesheet" href="design-system/index.css">
<style>
/* Dashboard-specific overrides (minimal, all tokens) */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: var(--space-lg) var(--space-md);
}

@media (min-width: 900px) {
  .container {
    padding: var(--space-lg) var(--space-lg);
  }
}

h1 {
  font-size: var(--font-size-title);
  font-weight: var(--font-weight-medium);
  line-height: var(--line-height-title);
  letter-spacing: var(--letter-spacing-title);
  margin-bottom: var(--space-xs);
}

.subtitle {
  color: var(--color-on-surface-variant);
  font-size: var(--font-size-label);
  line-height: var(--line-height-label);
  letter-spacing: var(--letter-spacing-label);
  text-transform: uppercase;
  margin-bottom: var(--space-md);
}

/* Stats bar uses stat-card component styles */
.stats {
  display: flex;
  gap: var(--stat-gap);
  margin-bottom: var(--space-md);
  flex-wrap: wrap;
}

.stat {
  text-align: center;
}

.stat .num {
  font-size: var(--stat-number-font-size);
  font-weight: var(--stat-number-font-weight);
  color: var(--stat-number-color);
  line-height: 1.2;
}

.stat .lbl {
  font-size: var(--stat-label-font-size);
  font-weight: var(--font-weight-medium);
  color: var(--stat-label-color);
  text-transform: uppercase;
  letter-spacing: var(--letter-spacing-label);
}

/* Results count */
#results-count {
  font-size: var(--font-size-label);
  color: var(--color-on-surface-variant);
  margin-bottom: var(--space-sm);
}

/* Empty state */
.empty-state {
  text-align: center;
  color: var(--color-on-surface-variant);
  padding: var(--space-xl);
  font-size: var(--font-size-body);
}

/* Loading state */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-xl);
  color: var(--color-on-surface-variant);
}

.loading::after {
  content: "";
  width: 20px;
  height: 20px;
  margin-left: var(--space-sm);
  border: 2px solid var(--color-outline-variant);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .loading::after {
    animation: none;
    border-top-color: var(--color-primary);
  }
}

/* Compare table delta colors (semantic, from tokens) */
.delta-positive { color: var(--color-delta-positive); font-weight: var(--font-weight-bold); }
.delta-negative { color: var(--color-delta-negative); font-weight: var(--font-weight-bold); }
.delta-neutral { color: var(--color-delta-neutral); font-weight: var(--font-weight-bold); }

/* Heatmap legend swatches use HSL from token values */
.heatmap-legend__swatch {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-outline-variant);
}

/* Explicit heatmap legend colors (HSL interpolation from token config) */
.heatmap-legend__swatch:nth-child(1) { background: hsl(0, 70%, 45%); }
.heatmap-legend__swatch:nth-child(2) { background: hsl(30, 70%, 45%); }
.heatmap-legend__swatch:nth-child(3) { background: hsl(60, 70%, 45%); }
.heatmap-legend__swatch:nth-child(4) { background: hsl(90, 70%, 45%); }
.heatmap-legend__swatch:nth-child(5) { background: hsl(120, 70%, 45%); }

/* Text truncation for long feature names */
.feature-name {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Error state */
.error-state {
  text-align: center;
  color: var(--color-error);
  padding: var(--space-xl);
  font-size: var(--font-size-body);
}

.error-state .btn {
  margin-top: var(--space-sm);
}

/* Keyboard hint */
.kbd-hint {
  font-size: 0.75rem;
  color: var(--color-on-surface-variant);
  font-family: var(--font-family-mono);
  margin-top: var(--space-xs);
  display: none;
}

@media (max-width: 600px) {
  .kbd-hint {
    display: block;
  }
}

/* Responsive adjustments */
@media (max-width: 600px) {
  .container {
    padding: var(--space-md);
  }
  .tab {
    padding: 6px 12px;
    font-size: var(--font-size-label); /* Keep 14px minimum */
  }
  .filters {
    flex-direction: column;
  }
  select, .search-box, .input {
    width: 100%;
  }
  table {
    font-size: var(--font-size-body);
  }
  th, td {
    padding: 6px 8px;
  }
  .field-group .form-field {
    min-width: 100%;
  }
  .heatmap-legend {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-xs);
  }
}
</style>
</head>
<body>
<div class="container">
<h1>Salesforce Release Notes — Dashboard</h1>
<p class="subtitle">Exploração interativa de releases</p>

<div class="stats" id="stats-bar" role="region" aria-label="Estatísticas gerais"></div>

<div class="tabs" role="tablist" aria-label="Abas do dashboard">
  <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-search" id="tab-btn-search" onclick="showTab('search')">Busca</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="tab-compare" id="tab-btn-compare" onclick="showTab('compare')">Comparar</button>
  <button class="tab" role="tab" aria-selected="false" aria-controls="tab-heatmap" id="tab-btn-heatmap" onclick="showTab('heatmap')">Heatmap</button>
</div>

<div id="tab-search" class="panel active" role="tabpanel" aria-labelledby="tab-btn-search">
  <div class="form-field" style="margin-bottom: var(--space-sm);">
    <label for="search-input" class="visually-hidden">Buscar features</label>
    <input type="text" class="input search-input" id="search-input" placeholder="Buscar feature..." oninput="filterFeatures()" aria-label="Buscar features" aria-describedby="search-hint">
    <small id="search-hint" style="color: var(--color-on-surface-variant); font-size: var(--font-size-label);">Digite para filtrar por nome da feature</small>
  </div>
  <div class="field-group" role="group" aria-label="Filtros">
    <div class="form-field" style="flex: 1; min-width: 180px;">
      <label for="filter-release" class="visually-hidden">Filtrar por release</label>
      <select id="filter-release" onchange="filterFeatures()" aria-label="Filtrar por release"><option value="">Todas as releases</option></select>
    </div>
    <div class="form-field" style="flex: 1; min-width: 180px;">
      <label for="filter-category" class="visually-hidden">Filtrar por categoria</label>
      <select id="filter-category" onchange="filterFeatures()" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
    </div>
  </div>
  <div id="results-count" aria-live="polite"></div>
  <div class="card card-table-wrapper" style="max-height:500px;overflow-y:auto">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Feature</th>
          <th scope="col">Categoria</th>
          <th scope="col">Release</th>
          <th scope="col">Disponibilidade</th>
        </tr>
      </thead>
      <tbody id="features-body"></tbody>
    </table>
  </div>
  <div style="display: flex; gap: var(--space-sm); margin-top: var(--space-sm); flex-wrap: wrap;">
    <button class="btn btn-primary" onclick="exportCSV()" aria-label="Exportar resultados filtrados como CSV" disabled>Exportar CSV</button>
    <button class="btn btn-primary" onclick="exportJSON()" aria-label="Exportar resultados filtrados como JSON" disabled>Exportar JSON</button>
  </div>
</div>

<div id="tab-compare" class="panel" role="tabpanel" aria-labelledby="tab-btn-compare">
  <fieldset>
    <legend class="visually-hidden">Comparar releases</legend>
    <div class="field-group" role="group" aria-label="Seleção de releases para comparação">
      <div class="form-field" style="flex: 1; min-width: 180px;">
        <label for="compare-a" class="visually-hidden">Release A</label>
        <select id="compare-a" onchange="compareReleases()" aria-label="Selecionar release A para comparação"><option value="">Release A</option></select>
      </div>
      <div class="form-field" style="flex: 1; min-width: 180px;">
        <label for="compare-b" class="visually-hidden">Release B</label>
        <select id="compare-b" onchange="compareReleases()" aria-label="Selecionar release B para comparação"><option value="">Release B</option></select>
      </div>
    </div>
  </fieldset>
  <div class="card card-table-wrapper">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">Categoria</th>
          <th id="col-a" scope="col">—</th>
          <th id="col-b" scope="col">—</th>
          <th scope="col">Delta</th>
        </tr>
      </thead>
      <tbody id="compare-body"></tbody>
    </table>
  </div>
</div>

<div id="tab-heatmap" class="panel" role="tabpanel" aria-labelledby="tab-btn-heatmap">
  <div class="form-field" style="max-width: 300px; margin-bottom: var(--space-md);">
    <label for="heatmap-release" class="visually-hidden">Selecionar release para heatmap</label>
    <select id="heatmap-release" onchange="renderHeatmap()" aria-label="Selecionar release para heatmap"><option value="">Selecione uma release</option></select>
  </div>

  <!-- Heatmap Legend for Accessibility -->
  <div class="heatmap-legend" aria-label="Legenda do heatmap de confiança">
    <span class="heatmap-legend__label">Confiança:</span>
    <div class="heatmap-legend__swatches">
      <div class="heatmap-legend__swatch" aria-label="Baixa (0-20%)"></div>
      <div class="heatmap-legend__swatch" aria-label="Baixa-Média (20-40%)"></div>
      <div class="heatmap-legend__swatch" aria-label="Média (40-60%)"></div>
      <div class="heatmap-legend__swatch" aria-label="Média-Alta (60-80%)"></div>
      <div class="heatmap-legend__swatch" aria-label="Alta (80-100%)"></div>
    </div>
    <span style="font-size: var(--font-size-label); color: var(--color-on-surface-variant);">Baixa → Alta</span>
  </div>

  <div class="heatmap" id="heatmap-grid" role="img" aria-label="Heatmap de confiança média por categoria"></div>
</div>

<!-- Global error toast container -->
<div id="error-toast" class="error-state" style="display: none; position: fixed; top: var(--space-md); right: var(--space-md); left: var(--space-md); max-width: 480px; margin: 0 auto; z-index: 1000; box-shadow: var(--shadow-dropdown);"></div>

</div>
<script>
const DATA = {DATA_JSON};
let filteredFeatures = [];
let isDataLoaded = false;

function init() {
  // Validate DATA exists and has required structure
  if (!DATA || !DATA.releases || !DATA.features) {
    showError('Dados do dashboard não carregados. Verifique se o JSON foi injetado corretamente.');
    return;
  }

  isDataLoaded = true;
  renderStats();
  populateSelects();
  populateCategories();
  filteredFeatures = DATA.features;
  renderFeatures();
  updateExportButtons();
}

function renderStats() {
  document.getElementById('stats-bar').innerHTML =
    '<div class="stat"><div class="num">' + DATA.total_releases + '</div><div class="lbl">Releases</div></div>' +
    '<div class="stat"><div class="num">' + DATA.total_features.toLocaleString('pt-BR') + '</div><div class="lbl">Features</div></div>';
}

function populateSelects() {
  const relSel = document.getElementById('filter-release');
  const cmpA = document.getElementById('compare-a');
  const cmpB = document.getElementById('compare-b');
  const hmSel = document.getElementById('heatmap-release');

  DATA.releases.forEach(r => {
    const opt = '<option value="'+escapeHtml(r.slug)+'">'+escapeHtml(r.name)+'</option>';
    relSel.innerHTML += opt;
    cmpA.innerHTML += opt;
    cmpB.innerHTML += opt;
    hmSel.innerHTML += opt;
  });
}

function populateCategories() {
  const cats = [...new Set(DATA.features.map(f => f.category).filter(Boolean))].sort();
  const catSel = document.getElementById('filter-category');
  cats.forEach(c => { catSel.innerHTML += '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>'; });
}

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const panel = document.getElementById('tab-'+name);
  if (panel) panel.classList.add('active');
  const tabs = ['search','compare','heatmap'];
  const idx = tabs.indexOf(name);
  if (idx >= 0) {
    const tabBtn = document.querySelectorAll('.tab')[idx];
    if (tabBtn) tabBtn.classList.add('active');
    // Update ARIA
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.setAttribute('aria-selected', i === idx ? 'true' : 'false');
    });
  }
}

function filterFeatures() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const rel = document.getElementById('filter-release').value;
  const cat = document.getElementById('filter-category').value;

  filteredFeatures = DATA.features.filter(f => {
    if (q && !f.name.toLowerCase().includes(q)) return false;
    if (rel && f.release !== rel) return false;
    if (cat && f.category !== cat) return false;
    return true;
  });
  renderFeatures();
  updateExportButtons();
}

function renderFeatures() {
  const tbody = document.getElementById('features-body');
  const count = filteredFeatures.length;
  document.getElementById('results-count').textContent = count + ' resultado' + (count !== 1 ? 's' : '');

  if (count === 0) {
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state">Nenhum resultado encontrado para os filtros atuais</div></td></tr>';
    return;
  }

  const rows = filteredFeatures.slice(0, 500).map(f =>
    '<tr><td class="feature-name">'+escapeHtml(f.name)+'</td><td>'+escapeHtml(f.category)+'</td><td>'+escapeHtml(f.release)+'</td><td>'+escapeHtml(f.availability)+'</td></tr>'
  ).join('');

  if (count > 500) {
    tbody.innerHTML = rows + '<tr><td colspan="4"><div class="empty-state">Mostrando 500 de ' + count.toLocaleString('pt-BR') + ' resultados. Refine a busca para ver mais.</div></td></tr>';
  } else {
    tbody.innerHTML = rows;
  }
}

function updateExportButtons() {
  const hasResults = filteredFeatures.length > 0;
  document.querySelectorAll('#tab-search .btn-primary').forEach(btn => {
    btn.disabled = !hasResults;
  });
}

function compareReleases() {
  const a = document.getElementById('compare-a').value;
  const b = document.getElementById('compare-b').value;

  if (!a || !b) {
    clearCompareTable();
    return;
  }

  if (a === b) {
    showToast('Selecione duas releases diferentes para comparar.', 'warning');
    document.getElementById('compare-b').value = '';
    return;
  }

  const rA = DATA.releases.find(r => r.slug === a);
  const rB = DATA.releases.find(r => r.slug === b);

  if (!rA || !rB) {
    showToast('Release não encontrada.', 'error');
    return;
  }

  document.getElementById('col-a').textContent = rA.name;
  document.getElementById('col-b').textContent = rB.name;

  const catsA = Object.fromEntries(rA.categories.map(c => [c.name, c.count]));
  const catsB = Object.fromEntries(rB.categories.map(c => [c.name, c.count]));
  const allCats = [...new Set([...Object.keys(catsA), ...Object.keys(catsB)])].sort();

  const tbody = document.getElementById('compare-body');
  tbody.innerHTML = allCats.map(name => {
    const vA = catsA[name] || 0;
    const vB = catsB[name] || 0;
    const delta = vB - vA;
    let deltaClass = 'delta-neutral';
    if (delta > 0) deltaClass = 'delta-positive';
    else if (delta < 0) deltaClass = 'delta-negative';
    return '<tr><td>'+escapeHtml(name)+'</td><td>'+vA.toLocaleString('pt-BR')+'</td><td>'+vB.toLocaleString('pt-BR')+'</td><td class="'+deltaClass+'">'+(delta>=0?'+':'')+delta+'</td></tr>';
  }).join('');
}

function clearCompareTable() {
  document.getElementById('col-a').textContent = '—';
  document.getElementById('col-b').textContent = '—';
  document.getElementById('compare-body').innerHTML = '';
}

function renderHeatmap() {
  const slug = document.getElementById('heatmap-release').value;
  const grid = document.getElementById('heatmap-grid');

  if (!slug) {
    grid.innerHTML = '';
    return;
  }

  const r = DATA.releases.find(x => x.slug === slug);
  if (!r) {
    grid.innerHTML = '<div class="error-state">Release não encontrada</div>';
    return;
  }

  grid.innerHTML = r.categories.map(c => {
    const catConf = c.avg_confidence || r.avg_confidence || 0.85;
    const heat = Math.round(catConf * 100);
    // hue = 0° (red) at 0% confidence → 120° (green) at 100% confidence
    const hue = heat * 1.2;
    const bg = 'hsl('+hue+',70%,45%)';
    return '<div class="heat-cell" style="background:'+bg+'" data-tip="'+escapeHtml(c.name)+': '+c.count+' features ('+heat+'% conf)" data-confidence="'+heat+'" role="img" aria-label="'+escapeHtml(c.name)+': '+c.count+' features, confiança '+heat+'%" tabindex="0">'+c.count+'</div>';
  }).join('');
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function showError(message) {
  const container = document.querySelector('.container');
  container.innerHTML = '<div class="error-state"><strong>Erro ao carregar dashboard</strong><p>'+escapeHtml(message)+'</p></div>';
}

function showToast(message, type) {
  const toast = document.getElementById('error-toast');
  toast.textContent = message;
  toast.style.background = type === 'error' ? 'var(--color-error-container)' : 'var(--color-tertiary-container)';
  toast.style.color = type === 'error' ? 'var(--color-on-error-container)' : 'var(--color-on-tertiary-container)';
  toast.style.display = 'block';

  setTimeout(() => {
    toast.style.display = 'none';
  }, 5000);
}

function exportCSV() {
  if (filteredFeatures.length === 0) {
    showToast('Nenhum dado para exportar.', 'warning');
    return;
  }

  try {
    const header = 'Feature,Categoria,Release,Disponibilidade\n';
    const rows = filteredFeatures.map(f =>
      '"'+String(f.name).replace(/"/g,'""')+'","'+String(f.category).replace(/"/g,'""')+'","'+String(f.release).replace(/"/g,'""')+'","'+String(f.availability).replace(/"/g,'""')+'"'
    ).join('\n');
    download('features.csv', header + rows, 'text/csv;charset=utf-8');
    showToast('CSV exportado com sucesso.');
  } catch (e) {
    showToast('Erro ao exportar CSV: '+e.message, 'error');
  }
}

function exportJSON() {
  if (filteredFeatures.length === 0) {
    showToast('Nenhum dado para exportar.', 'warning');
    return;
  }

  try {
    download('features.json', JSON.stringify(filteredFeatures, null, 2), 'application/json;charset=utf-8');
    showToast('JSON exportado com sucesso.');
  } catch (e) {
    showToast('Erro ao exportar JSON: '+e.message, 'error');
  }
}

function download(name, content, type) {
  try {
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  } catch (e) {
    // Fallback for browsers that don't support Blob/download
    const win = window.open('', '_blank');
    win.document.write('<pre>'+escapeHtml(content)+'</pre>');
  }
}

// Keyboard navigation hint
document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab' && !document.querySelector('.kbd-hint')) {
    const hint = document.createElement('div');
    hint.className = 'kbd-hint';
    hint.textContent = 'Tab: navegar | Enter/Espaço: ativar | Setas: em selects/heatmap';
    document.body.appendChild(hint);
    setTimeout(() => hint.remove(), 5000);
  }
});

// Initialize when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
