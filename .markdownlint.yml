# markdownlint-cli2 config for technical documentation with code blocks and Mermaid diagrams.
# This file is YAML, not Markdown — the rules below do not apply to it.

default: true

# Ignorar arquivos que não são documentação Markdown
ignore:
  - ".markdownlint.yml"
  - ".markdownlintignore"
  - "node_modules/**"
  - "site/**"
  - "package.json"
  - "package-lock.json"

# ── Headings ────────────────────────────────────────────────────────────
heading-style: setext
first-line-h1: false

# ── Content ─────────────────────────────────────────────────────────────
front-matter-title-format: "%(title)s"
no-duplicate-header: true
no-trailing-spaces: true
hard-tabs: false

# ── Lines ───────────────────────────────────────────────────────────────
line-length: false
MD013: false

# ── HTML ────────────────────────────────────────────────────────────────
MD033: false

# ── Lists ───────────────────────────────────────────────────────────────
ul-indent: 2
MD007:
  indent: 2

# ── Spacing ─────────────────────────────────────────────────────────────
blanks-around-headings: true
blanks-around-code-blocks: true
blanks-around-tables: true

# ── Specific rules ──────────────────────────────────────────────────────
MD024:
  style: strict
MD004:
  style: subtree
MD005:
  style: consistent
MD046:
  style: fenced

# ── Tables ──────────────────────────────────────────────────────────────
MD060: false
