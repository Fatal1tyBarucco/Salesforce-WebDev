# Configuração do markdownlint-cli2 para documentação do projeto
# Regras mais permissivas para docs técnicos com código e Mermaid

default: true

# ── Títulos ─────────────────────────────────────────────────────────────
heading-style: setext           # Usar underline (=== ///) em H1/H2
first-line-h1: false            # Não exige H1 na primeira linha

# ── Conteúdo ────────────────────────────────────────────────────────────
front-matter-title-format: "%(title)s"
no-duplicate-header: true       # Não permite headers duplicados na mesma página
no-trailing-spaces: true        # Não permite espaços no final das linhas
hard-tabs: false                # Não permite tabs (use spaces)

# ── Linhas ──────────────────────────────────────────────────────────────
line-length: false              # Desativado — código e Mermaid precisam de linhas longas
MD013: false                    # Alias para line-length (explicitado)

# ── HTML ────────────────────────────────────────────────────────────────
MD033: false                    # Inline HTML permitido (banners, Mermaid, snippets)

# ── Listas ──────────────────────────────────────────────────────────────
ul-indent: 2                    # Indentação de listas sem marcador: 2 spaces
ol-prefix: decimal             # Listas ordenadas usam decimal (1. 2. 3.)

# ── Espaçamento ─────────────────────────────────────────────────────────
blanks-around-headings: true    # Quebras de linha antes/depois de headings
blanks-around-code-blocks: true # Quebras de linha antes/depois de code blocks
blanks-around-tables: true      # Quebras de linha antes/depois de tables

# ── Regras específicas ──────────────────────────────────────────────────
MD024:
  style: strict                # Não permite headings duplicados na mesma página
MD004:
  style: subtree               # Listas aninhadas devem usar subtree
MD005:
  style: consistent            # Listas devem ter indentation consistente
MD046:
  style: fenced               # Code blocks devem usar fenced (```) em vez de indented
