site_name: Salesforce Release Intelligence
site_description: Automated pipeline for extracting, classifying, and versioning Salesforce Release Notes — Knowledge-as-Code with AI-powered analysis, structured Markdown artifacts, and cross-release feature tracking (SFEL)
site_url: https://fatal1tybarucco.github.io/Salesforce-WebDev/
site_author: Fatal1tyBarucco
repo_url: https://github.com/Fatal1tyBarucco/Salesforce-WebDev
repo_name: Fatal1tyBarucco/Salesforce-WebDev
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 Fatal1tyBarucco — Educational & Technical Reference

# Superfícies fora do índice público (ADR-012): permanecem no repositório
# (histórico + outputs do pipeline de IA), mas não são publicadas nem
# exigidas no nav. O validador de contrato conhece a mesma lista.
exclude_docs: |
  ai-generated/
  internal/
  plans/

# Orphan guard (ADR-012, req 2.4): páginas fora do nav viram WARNING e
# falham o próprio `mkdocs build --strict` (nativo do MkDocs é apenas INFO).
hooks:
  - docs/hooks/orphan_guard.py

theme:
  name: material
  custom_dir: custom
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: material/lightbulb
      abstract: material/book-outline
      info: material/information
      tip: material/check-circle-outline
      success: material/check-circle
      question: material/help-circle
      warning: material/alert-circle
      failure: material/close-circle
      danger: material/alert-decagram
      bug: material/bug
      example: material/flask-outline
      quote: material/format-quote-close

extra_javascript:
  - assets/javascripts/banner.js
  - assets/javascripts/enhanced_search.js

extra_css:
  - assets/stylesheets/banner.css
  - assets/stylesheets/enhanced_search.css

plugins:
  - search:
      separator: '[\s\-\.,:/\\(\\)\\[\\]]+'
      lang:
        - en
        - pt
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
  - section-index
  - privacy
  - social:
      enabled: !ENV [CI, false]
  - minify:
      minify_html: true
  - htmlproofer:
      ignore_urls:
        - https://github.com/Fatal1tyBarucco/Salesforce-WebDev/issues
        - https://fatal1tybarucco.github.io/Salesforce-WebDev/
      validate_external_urls: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.arithmatex:
      generic: true

extra:
  # Banner de release (bloco `announce` em custom/main.html). O texto é
  # reconciliado deterministicamente pelo docs_sync_engine.py a partir de
  # releases/*.meta.json — nunca editar manualmente.
  announce: "Release mais recente: Winter '27 — documentação sincronizada com o repositório."
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fatal1tyBarucco/Salesforce-WebDev
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/salesforce-release-notes/
  # Analytics removido (ADR-012): o placeholder G-XXXXXXXXXX era um defeito
  # de produção e não há propriedade/segredo configurado. Para reativar,
  # adicione `analytics: {provider: google, property: !ENV [GA_PROPERTY, '']}`
  # com o segredo GA_PROPERTY no CI — nunca um placeholder commitado.
  version:
    provider: mike
  alternate:
    - name: Português
      link: /
      lang: pt-BR
    - name: English
      # URL absoluta: o alias `latest` é permanente no ledger do mike;
      # link relativo quebraria em páginas profundas (ADR-012, DoD5).
      link: https://fatal1tybarucco.github.io/Salesforce-WebDev/latest/en/
      lang: en-US
  generator: false

