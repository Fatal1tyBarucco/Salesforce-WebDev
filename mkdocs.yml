site_name: Salesforce Release Intelligence
site_description: Automated pipeline for extracting and classifying Salesforce Release Notes
site_url: https://fatal1tybarucco.github.io/Salesforce-WebDev/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_javascript:
  - assets/javascripts/banner.js
  - assets/javascripts/enhanced_search.js

extra_css:
  - assets/stylesheets/banner.css
  - assets/stylesheets/enhanced_search.css

plugins:
  - search:
      separator: '[\s\-\.\,\:\/\(\)\[\]]+'
      lang:
        - en
        - pt
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      base_path: ["."]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fatal1tyBarucco/Salesforce-WebDev

