# Promptfoo configuration for prompt evaluation (ADR-012, requisito 4.2)
#
# Avaliação keyless (fidelidade do PROMPT, determinística):
#   PROMPTFOO_PYTHON=.venv/bin/python npx --yes promptfoo eval \
#       -c .promptfoo.yaml --filter-providers deterministic-echo
#
# Avaliação ao vivo com modelos reais (requer chaves no ambiente):
#   PROMPTFOO_PYTHON=.venv/bin/python npx --yes promptfoo eval -c .promptfoo.yaml
#
# Os asserts de fidelidade ao manifest inspecionam o PROMPT renderizado
# (context.prompt), não a resposta do modelo — a fidelidade do contrato é
# uma propriedade determinística do prompt, independente do provedor.
# Os loaders em scripts/promptfoo_prompts.py fazem o bootstrap de sys.path
# (os módulos de produção usam imports relativos + pydantic).

prompts:
  - id: file://scripts/promptfoo_prompts.py:prompt_classification
    label: classification
  - id: file://scripts/promptfoo_prompts.py:prompt_enrichment
    label: enrichment
  - id: file://scripts/promptfoo_prompts.py:prompt_reporting
    label: reporting
  - id: file://scripts/promptfoo_prompts.py:prompt_reconciliation
    label: reconciliation

providers:
  - id: exec:python3 scripts/promptfoo_echo.py
    label: deterministic-echo
  - openrouter:openrouter/free
  - google:gemini-3.6-flash

tests:
  # Schema de saída da classificação — espelho exato de
  # src/ai/prompts/validation.py:ClassificationOutput, validado em JS
  # (determinístico, sem dependência de loader de schema).
  - prompts: [classification]
    vars:
      feature_text: "Nova funcionalidade de IA para automação de vendas"
    assert:
      - type: javascript
        metric: classification-schema
        value: |
          let o;
          try { o = JSON.parse(output); } catch (e) {
            return { pass: false, score: 0, reason: 'output is not valid JSON' };
          }
          const enums = {
            type: ['security','performance','bug_fix','new_feature','improvement',
                   'deprecation','breaking_change','integration','ui_ux','other'],
            impact: ['alto','médio','baixo'],
            audience: ['usuários','admins','ambos'],
            priority: ['crítica','importante','opcional'],
          };
          for (const [k, allowed] of Object.entries(enums)) {
            if (!allowed.includes(o[k])) {
              return { pass: false, score: 0, reason: `field ${k} invalid: ${o[k]}` };
            }
          }
          if (typeof o.justification !== 'string' ||
              o.justification.length < 5 || o.justification.length > 300) {
            return { pass: false, score: 0, reason: 'justification length out of bounds' };
          }
          const extra = Object.keys(o).filter((k) => !(k in enums) && k !== 'justification');
          if (extra.length > 0) {
            return { pass: false, score: 0, reason: 'unexpected fields: ' + extra.join(', ') };
          }
          return { pass: true, score: 1, reason: 'matches ClassificationOutput schema' };

  # Fidelidade ao manifest (ADR-012): invariantes do contrato no prompt
  # de reconciliação — fonte de verdade, proibição de invenção, JSON
  # estrito, superfície escrevível restrita, remoção de nav, paridade.
  - prompts: [reconciliation]
    providers: [deterministic-echo]
    vars: {}
    assert:
      - type: javascript
        metric: manifest-fidelity
        value: |
          const p = String(context.prompt || '');
          const invariants = [
            'single source of truth',
            'never invent functionality',
            'STRICT JSON',
            'README.en.md',
            'mkdocs.yml',
            'pt-BR docs stay pt-BR',
            'Only paths under docs/',
            'strip their nav entries',
          ];
          const missing = invariants.filter((s) => !p.includes(s));
          if (missing.length > 0) {
            return { pass: false, score: 0, reason: 'missing invariants: ' + missing.join(', ') };
          }
          if (p.includes('G-XXXXXXXXXX')) {
            return { pass: false, score: 0, reason: 'analytics placeholder leaked into prompt' };
          }
          return { pass: true, score: 1, reason: 'all manifest-fidelity invariants present' };

defaultTest:
  vars:
    feature_text: "Test feature for validation"
  assert:
    - type: not-contains
      value: "error"
