# Promptfoo configuration for prompt evaluation
# Run with: uvx promptfoo eval -c .promptfoo.yaml

prompts:
  - file://src/ai/prompts/classification.py:build_classification_system_prompt
  - file://src/ai/prompts/enrichment.py:build_enrichment_prompt
  - file://src/ai/prompts/reporting.py:build_reporting_prompt
  - file://src/ai/prompts/validation.py:build_validation_prompt

providers:
  - openrouter:openrouter/free
  - opencode:gemini-3.6-flash
  - google:gemini-3.6-flash

tests:
  - vars:
      feature_text: "Nova funcionalidade de IA para automação de vendas"
    assert:
      - type: json-schema
        schema: src/ai/schemas/classification.py:ClassificationResult

defaultTest:
  vars:
    feature_text: "Test feature for validation"
  assert:
    - type: not-contains
      value: "error"
